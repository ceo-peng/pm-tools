<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>鉑翡斯 工具目錄</title>
    <style>
      :root {
        --line: #e4e4e7;
        --muted: #6b7280;
        --ink: #111827;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f7f7f8;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
      .lede { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
      .group { margin-top: 36px; }
      .group h2 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .cards { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
      .card {
        display: block;
        padding: 16px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      }
      .card:hover {
        border-color: #a1a1aa;
        box-shadow: 0 1px 3px rgb(0 0 0 / 8%);
        transform: translateY(-1px);
      }
      .card:focus-visible { outline: 2px solid #111827; outline-offset: 2px; }
      .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .card .name { font-weight: 600; font-size: 15px; }
      .card .desc { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
      .ext {
        flex: none;
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      footer {
        margin-top: 48px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .cards { grid-template-columns: 1fr; }
        .wrap { padding: 28px 16px 48px; }
        h1 { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <!--
      要新增工具：只改下面 TOOLS 這個陣列，一個工具一筆。
        group  分類名稱，同名的排在同一區，區塊順序照第一次出現的順序
        name   顯示名稱
        desc   一句話說明，寫給不熟的人看
        href   站內用相對路徑（例：taipei_inventory/），站外用完整網址
      站外連結會自動加上「外部」標記並開新分頁，不用另外設定。
      改完存檔推 main 即上線，不需要 build。
    -->
    <script>
      const TOOLS = [
        {
          group: "庫存",
          name: "台北倉庫存更新",
          desc: "台北倉出貨與銷售扣庫存，送出後自動更新庫存表並寄通知信",
          href: "taipei_inventory/",
        },
        {
          group: "庫存",
          name: "三重倉庫存更新",
          desc: "三重倉進貨與出貨兩用，送出後自動更新庫存表並寄通知信",
          href: "sanchong_inventory/",
        },
        {
          group: "分析",
          name: "庫存看板",
          desc: "各倉品項即時庫存總覽",
          href: "inventory_dashboard/",
        },
        {
          group: "分析",
          name: "出貨量與庫存警示",
          desc: "比對歷史出貨速度與現有庫存，標出可能缺貨的品項",
          href: "outflow_rate/",
        },
      ];
    </script>

    <div class="wrap">
      <header>
        <h1>鉑翡斯 工具目錄</h1>
        <p class="lede">內部營運工具入口。找不到要用的東西，跟 James 說一聲加進來。</p>
      </header>

      <main id="groups"></main>

      <footer>最後更新 2026/07/27 17:16</footer>
    </div>

    <script>
      (function () {
        const esc = (s) =>
          String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const isExternal = (href) => /^https?:\/\//i.test(href);

        const order = [];
        const byGroup = new Map();
        for (const t of TOOLS) {
          if (!byGroup.has(t.group)) {
            byGroup.set(t.group, []);
            order.push(t.group);
          }
          byGroup.get(t.group).push(t);
        }

        const card = (t) => {
          const ext = isExternal(t.href);
          return (
            '<a class="card" href="' +
            esc(t.href) +
            '"' +
            (ext ? ' target="_blank" rel="noopener noreferrer"' : "") +
            '><span class="top"><span class="name">' +
            esc(t.name) +
            "</span>" +
            (ext ? '<span class="ext">外部</span>' : "") +
            '</span><p class="desc">' +
            esc(t.desc) +
            "</p></a>"
          );
        };

        document.getElementById("groups").innerHTML = order
          .map(
            (g) =>
              '<section class="group"><h2>' +
              esc(g) +
              '</h2><div class="cards">' +
              byGroup.get(g).map(card).join("") +
              "</div></section>"
          )
          .join("");
      })();
    </script>
  </body>
</html>
