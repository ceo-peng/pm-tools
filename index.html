<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>鉑翡斯 工具目錄</title>
    <style>
      :root {
        --line: #dce5df;
        --muted: #4f6259;
        --ink: #172e28;
        --green: #173d36;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f5f7f3;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 64px; }
      .hero {
        padding: 32px;
        color: #fff;
        background: var(--green);
        border-radius: 22px;
      }
      h1 { margin: 0; font-size: clamp(25px, 5vw, 34px); letter-spacing: -0.01em; }
      .lede { margin: 8px 0 0; font-size: 15px; color: #e1ece6; }
      .portal-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        margin-top: 22px;
        padding: 10px 17px;
        border-radius: 9px;
        background: #efdfbf;
        color: #1d352a;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }
      .portal-link:hover { background: #fff2d6; }
      .portal-link:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
      .group { margin-top: 30px; }
      .group h2 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
      }
      .cards { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
      .card {
        display: block;
        padding: 16px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      }
      .card:hover {
        border-color: #7b998b;
        box-shadow: 0 1px 3px rgb(0 0 0 / 8%);
        transform: translateY(-1px);
      }
      .card:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
      .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .card .name { font-weight: 600; font-size: 15px; }
      .card .desc { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
      .ext {
        flex: none;
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      footer {
        margin-top: 48px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .cards { grid-template-columns: 1fr; }
        .wrap { padding: 24px 16px 48px; }
        .hero { padding: 24px 20px; }
      }
    </style>
  </head>
  <body>
    <!--
      要新增工具：只改下面 TOOLS 這個陣列，一個工具一筆。
        group  分類名稱，同名的排在同一區，區塊順序照第一次出現的順序
        name   顯示名稱
        desc   一句話說明，寫給不熟的人看
        href   站內用相對路徑（例：taipei_inventory/），站外用完整網址
      站外連結會自動加上「外部」標記並開新分頁，不用另外設定。
      改完存檔推 main 即上線，不需要 build。
    -->
    <script>
      const TOOLS = [
        {
          group: "倉庫操作",
          name: "台北倉庫存更新",
          desc: "台北倉出貨與銷售扣庫存，送出後自動更新庫存表並寄通知信",
          href: "taipei_inventory/",
        },
        {
          group: "倉庫操作",
          name: "三重倉庫存更新",
          desc: "三重倉進貨與出貨兩用，送出後自動更新庫存表並寄通知信",
          href: "sanchong_inventory/",
        },
        {
          group: "庫存查詢",
          name: "庫存看板",
          desc: "各倉品項即時庫存總覽",
          href: "inventory_dashboard/",
        },
        {
          group: "庫存查詢",
          name: "出貨量與庫存警示",
          desc: "比對歷史出貨速度與現有庫存，標出可能缺貨的品項",
          href: "outflow_rate/",
        },
      ];
    </script>

    <div class="wrap">
      <header class="hero">
        <h1>鉑翡斯 工具目錄</h1>
        <p class="lede">進貨申請、圖片製作、檔期規劃與內部工具。</p>
        <a class="portal-link" href="https://product-ingredient-hub.vercel.app/portal">
          登入公司工作台 <span aria-hidden="true">→</span>
        </a>
      </header>

      <main id="groups"></main>

      <footer>最後更新 2026/11/19 07:55</footer>
    </div>

    <script>
      (function () {
        const esc = (s) =>
          String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const isExternal = (href) => /^https?:\/\//i.test(href);

        const order = [];
        const byGroup = new Map();
        for (const t of TOOLS) {
          if (!byGroup.has(t.group)) {
            byGroup.set(t.group, []);
            order.push(t.group);
          }
          byGroup.get(t.group).push(t);
        }

        const card = (t) => {
          const ext = isExternal(t.href);
          return (
            '<a class="card" href="' +
            esc(t.href) +
            '"' +
            (ext ? ' target="_blank" rel="noopener noreferrer"' : "") +
            '><span class="top"><span class="name">' +
            esc(t.name) +
            "</span>" +
            (ext ? '<span class="ext">外部</span>' : "") +
            '</span><p class="desc">' +
            esc(t.desc) +
            "</p></a>"
          );
        };

        document.getElementById("groups").innerHTML = order
          .map(
            (g) =>
              '<section class="group"><h2>' +
              esc(g) +
              '</h2><div class="cards">' +
              byGroup.get(g).map(card).join("") +
              "</div></section>"
          )
          .join("");
      })();
    </script>
  </body>
</html>
