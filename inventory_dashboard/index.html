<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Inventory Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 240 10% 3.9%;
            --card: 0 0% 100%;
            --card-foreground: 240 10% 3.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 240 10% 3.9%;
            --primary: 240 5.9% 10%;
            --primary-foreground: 0 0% 98%;
            --secondary: 240 4.8% 95.9%;
            --secondary-foreground: 240 5.9% 10%;
            --muted: 240 4.8% 95.9%;
            --muted-foreground: 240 3.8% 46.1%;
            --accent: 240 4.8% 95.9%;
            --accent-foreground: 240 5.9% 10%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 0 0% 98%;
            --border: 240 5.9% 90%;
            --input: 240 5.9% 90%;
            --ring: 240 10% 3.9%;
            --radius: 0.5rem;
        }
        
        .dark {
            --background: 240 10% 3.9%;
            --foreground: 0 0% 98%;
            --card: 240 10% 3.9%;
            --card-foreground: 0 0% 98%;
            --popover: 240 10% 3.9%;
            --popover-foreground: 0 0% 98%;
            --primary: 0 0% 98%;
            --primary-foreground: 240 5.9% 10%;
            --secondary: 240 3.7% 15.9%;
            --secondary-foreground: 0 0% 98%;
            --muted: 240 3.7% 15.9%;
            --muted-foreground: 240 5% 64.9%;
            --accent: 240 3.7% 15.9%;
            --accent-foreground: 0 0% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 0 0% 98%;
            --border: 240 3.7% 15.9%;
            --input: 240 3.7% 15.9%;
            --ring: 240 4.9% 83.9%;
        }

        * {
            border-color: hsl(var(--border));
        }

        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        .status-expired {
            background-color: hsl(var(--destructive));
            color: hsl(var(--destructive-foreground));
        }

        .status-warning {
            background-color: hsl(40 96% 84%);
            color: hsl(25 95% 53%);
        }

        .tier-card {
            cursor: pointer;
            transition: box-shadow 0.15s, transform 0.15s;
        }

        .tier-card:hover {
            box-shadow: 0 4px 10px -2px rgb(0 0 0 / 0.12);
            transform: translateY(-1px);
        }

        .tier-card[data-active="true"] {
            outline: 2px solid hsl(var(--ring));
            outline-offset: 1px;
        }

        .batch-row td {
            background-color: hsl(var(--muted) / 0.35);
        }

        .data-table th {
            background-color: hsl(var(--muted) / 0.5);
        }

        .data-table tbody tr:hover {
            background-color: hsl(var(--muted) / 0.25);
        }

        .card {
            background-color: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            color: hsl(var(--card-foreground));
        }

        /* 到期分層配色，寫在 .card 之後才不會被卡片底色蓋掉 */
        .tier-expired, .card.tier-expired {
            background-color: hsl(0 84% 94%);
            color: hsl(0 72% 35%);
        }

        .tier-d90, .card.tier-d90 {
            background-color: hsl(28 96% 92%);
            color: hsl(25 90% 33%);
        }

        .tier-d180, .card.tier-d180 {
            background-color: hsl(45 95% 90%);
            color: hsl(38 85% 28%);
        }

        .tier-safe, .card.tier-safe {
            background-color: hsl(145 60% 93%);
            color: hsl(150 55% 25%);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            border-radius: calc(var(--radius) - 2px);
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            outline: none;
            cursor: pointer;
            border: none;
        }

        .btn-outline {
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        .btn-outline:hover {
            background-color: hsl(var(--accent));
            color: hsl(var(--accent-foreground));
        }

        .btn-ghost {
            background-color: transparent;
            color: hsl(var(--foreground));
        }

        .btn-ghost:hover {
            background-color: hsl(var(--accent));
            color: hsl(var(--accent-foreground));
        }

        .input {
            display: flex;
            height: 2.5rem;
            width: 100%;
            border-radius: calc(var(--radius) - 2px);
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            padding: 0 0.75rem;
            font-size: 0.875rem;
            color: hsl(var(--foreground));
        }

        .input:focus {
            outline: 2px solid hsl(var(--ring));
            outline-offset: 2px;
        }

        .select-trigger {
            display: flex;
            height: 2.5rem;
            width: 100%;
            align-items: center;
            justify-content: between;
            border-radius: calc(var(--radius) - 2px);
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--background));
            padding: 0 0.75rem;
            font-size: 0.875rem;
            color: hsl(var(--foreground));
            cursor: pointer;
        }

        .popover {
            position: absolute;
            z-index: 50;
            background-color: hsl(var(--popover));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .checkbox {
            height: 1rem;
            width: 1rem;
            border: 1px solid hsl(var(--border));
            border-radius: 0.25rem;
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .collapsible-content {
            overflow: hidden;
            transition: all 0.2s ease-in-out;
        }

        .collapsible-content[data-state="closed"] {
            height: 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // Icons as SVG components
        const RefreshCw = ({ className, ...props }) => (
            <svg className={className} {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M3 21v-5h5"/>
            </svg>
        );

        const Settings = ({ className, ...props }) => (
            <svg className={className} {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        );

        const Search = ({ className, ...props }) => (
            <svg className={className} {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
        );

        const AlertTriangle = ({ className, ...props }) => (
            <svg className={className} {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                <path d="M12 9v4"/>
                <path d="M12 17h.01"/>
            </svg>
        );

        const ChevronDown = ({ className, ...props }) => (
            <svg className={className} {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m6 9 6 6 6-6"/>
            </svg>
        );

        const ChevronUp = ({ className, ...props }) => (
            <svg className={className} {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m18 15-6-6-6 6"/>
            </svg>
        );

        // 用本地時區格式化日期（避免 toISOString 在 UTC+8 少一天）
        const fmtDate = (d) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        // 到期分層：四層互斥
        const TIERS = [
            { key: 'expired', label: '已過期', short: '已過期', min: -Infinity, max: -1, cls: 'tier-expired' },
            { key: 'd90', label: '90天內', short: '90天內', min: 0, max: 90, cls: 'tier-d90' },
            { key: 'd180', label: '91至180天', short: '91-180天', min: 91, max: 180, cls: 'tier-d180' },
            { key: 'safe', label: '180天以上', short: '180天+', min: 181, max: Infinity, cls: 'tier-safe' }
        ];
        const tierOf = (dte) => TIERS.find(t => dte >= t.min && dte <= t.max);

        // 篩選條件存進網址 hash，方便同事互丟連結
        const readUrlState = () => {
            const p = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
            return {
                q: p.get('q') || '',
                dte: p.get('dte') || '≤90',
                min: p.get('min') || '',
                max: p.get('max') || '',
                // 網址被改成空的 loc 會讓所有倉都不選，畫面全空，這裡兜回全部
                loc: (() => {
                    const parsed = (p.get('loc') || '').split(',').filter(Boolean);
                    return parsed.length ? parsed : ['ALL'];
                })(),
                sort: p.get('sort') || 'dte',
                dir: p.get('dir') === 'desc' ? 'desc' : 'asc'
            };
        };

        const SOURCES_KEY = 'pm_inventory_sources_v1';

        // Location Multi-Select Component
        const LocationMultiSelect = ({ locationFilter, setLocationFilter }) => {
            const [open, setOpen] = useState(false);
            const boxRef = React.useRef(null);

            // 點外面收起面板
            useEffect(() => {
                if (!open) return;
                const onDown = (e) => {
                    if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
                };
                document.addEventListener('mousedown', onDown);
                return () => document.removeEventListener('mousedown', onDown);
            }, [open]);

            const locations = [
                { value: 'ALL', label: '全部' },
                { value: 'TAIPEI', label: 'TPE' },
                { value: 'SANCHONG', label: 'SC' },
                { value: 'MOMO', label: 'MOMO' }
            ];

            const handleLocationToggle = (value) => {
                if (value === 'ALL') {
                    setLocationFilter(['ALL']);
                } else {
                    const newFilter = locationFilter.includes('ALL')
                        ? [value]
                        : locationFilter.includes(value)
                        ? locationFilter.filter(l => l !== value)
                        : [...locationFilter.filter(l => l !== 'ALL'), value];
                    
                    setLocationFilter(newFilter.length === 0 ? ['ALL'] : newFilter);
                }
            };

            const selectedText = locationFilter.includes('ALL') 
                ? '全部' 
                : locationFilter.length === 0
                ? 'Select locations'
                : locationFilter.join(', ');

            return (
                <div className="relative flex-1 lg:flex-none" ref={boxRef}>
                    <button
                        className="btn btn-outline w-full lg:w-48 h-10 px-3 justify-between"
                        onClick={() => setOpen(!open)}
                    >
                        <span className="truncate">{selectedText}</span>
                        <ChevronDown className="h-4 w-4 shrink-0 opacity-50" />
                    </button>
                    {open && (
                        <div className="popover w-48 p-3 mt-1">
                            <div className="space-y-2">
                                {locations.map(location => (
                                    <div key={location.value} className="flex items-center space-x-2">
                                        <input
                                            type="checkbox"
                                            className="checkbox"
                                            id={location.value}
                                            checked={locationFilter.includes(location.value)}
                                            onChange={() => handleLocationToggle(location.value)}
                                        />
                                        <label htmlFor={location.value} className="text-sm font-normal cursor-pointer">
                                            {location.label}
                                        </label>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Earliest Expiry Collapsible Component
        const EarliestExpiryCollapsible = ({ data }) => {
            const [isOpen, setIsOpen] = useState(false);

            const earliestItem = data.reduce((earliest, item) => 
                !earliest || item.expiry < earliest.expiry ? item : earliest, 
                null
            );

            if (!earliestItem) {
                return <div className="text-sm opacity-60">No items</div>;
            }

            const itemsWithEarliestDate = data.filter(item => 
                item.expiry.getTime() === earliestItem.expiry.getTime()
            );

            return (
                <div className="space-y-2">
                    <div className="text-2xl font-bold">
                        {fmtDate(earliestItem.expiry)}
                    </div>
                    <div className="text-sm opacity-60">
                        {earliestItem.dte} days remaining
                    </div>
                    
                    <div>
                        <button
                            className="btn btn-ghost p-0 h-auto text-xs text-blue-600 hover:text-blue-500"
                            onClick={() => setIsOpen(!isOpen)}
                        >
                            <span>{itemsWithEarliestDate.length} item{itemsWithEarliestDate.length !== 1 ? 's' : ''}</span>
                            {isOpen ? <ChevronUp className="h-3 w-3 ml-1" /> : <ChevronDown className="h-3 w-3 ml-1" />}
                        </button>
                        <div className={`collapsible-content mt-2 ${isOpen ? '' : 'hidden'}`}>
                            <div className="max-h-32 overflow-y-auto space-y-1">
                                {itemsWithEarliestDate.map((item, index) => (
                                    <div key={index} className="text-xs opacity-60 p-1 bg-gray-100 rounded">
                                        {item.name}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const PMInventoryDashboard = () => {
            const urlState = React.useRef(readUrlState()).current;
            const [loading, setLoading] = useState(false);
            const [data, setData] = useState([]);
            const [searchTerm, setSearchTerm] = useState(urlState.q);
            const [dteFilter, setDteFilter] = useState(urlState.dte);
            const [customDteMin, setCustomDteMin] = useState(urlState.min);
            const [customDteMax, setCustomDteMax] = useState(urlState.max);
            const [locationFilter, setLocationFilter] = useState(urlState.loc.length ? urlState.loc : ['ALL']);
            const [sortField, setSortField] = useState(urlState.sort);
            const [sortDirection, setSortDirection] = useState(urlState.dir);
            const [expanded, setExpanded] = useState({});
            const [showSettings, setShowSettings] = useState(false);
            const [lastFetch, setLastFetch] = useState(null);
            const [errors, setErrors] = useState([]);
            const [diag, setDiag] = useState([]);
            const [showDiag, setShowDiag] = useState(false);
            const [zeroHidden, setZeroHidden] = useState(0);

            const defaultSources = [{
                name: 'TPE',
                sheetId: '14yjT90s9CV988KZZ_o6m8F4LbeDWpKTuqVO66gfLboI',
                sheetName: 'inventory_tracking',
                headerRow: 4,
                nameCol: 'D',
                expiryCol: 'E',
                qtyCol: 'J'
            }, {
                name: 'SC',
                sheetId: '12C25rcfSEMtSkkARzLtxlW9Wmhu64m6eSP_KoK8M-js',
                sheetName: 'inventory_tracking',
                headerRow: 4,
                nameCol: 'D',
                expiryCol: 'E',
                qtyCol: 'J'
            }, {
                name: 'MOMO',
                sheetId: '1j04xLITImSX6WgtXkaGQfs0IZ5E8r3UEOrT2CKKGAxE',
                sheetName: 'inventory_tracking',
                headerRow: 4,
                nameCol: 'D',
                expiryCol: 'E',
                qtyCol: 'J'
            }];

            // 試算表設定記在瀏覽器，重新整理不會退回預設
            const [sources, setSources] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem(SOURCES_KEY) || 'null');
                    if (Array.isArray(saved) && saved.length) {
                        return defaultSources.map(d => ({ ...d, ...(saved.find(s => s.name === d.name) || {}) }));
                    }
                } catch (e) { /* 壞掉就用預設 */ }
                return defaultSources;
            });

            // 篩選條件同步進網址
            useEffect(() => {
                const p = new URLSearchParams();
                if (searchTerm) p.set('q', searchTerm);
                if (dteFilter !== '≤90') p.set('dte', dteFilter);
                if (customDteMin) p.set('min', customDteMin);
                if (customDteMax) p.set('max', customDteMax);
                if (!locationFilter.includes('ALL')) p.set('loc', locationFilter.join(','));
                if (sortField !== 'dte') p.set('sort', sortField);
                if (sortDirection !== 'asc') p.set('dir', sortDirection);
                const next = p.toString();
                const url = window.location.pathname + window.location.search + (next ? '#' + next : '');
                window.history.replaceState(null, '', url);
            }, [searchTerm, dteFilter, customDteMin, customDteMax, locationFilter, sortField, sortDirection]);

            // CSV parsing utility
            const parseCSV = (csv) => {
                const rows = [];
                let currentRow = [];
                let currentField = '';
                let inQuotes = false;
                let i = 0;

                while (i < csv.length) {
                    const char = csv[i];
                    const nextChar = csv[i + 1];

                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            currentField += '"';
                            i += 2;
                            continue;
                        }
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        currentRow.push(currentField.trim());
                        currentField = '';
                    } else if ((char === '\n' || char === '\r') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') i++;
                        currentRow.push(currentField.trim());
                        if (currentRow.some(field => field.length > 0)) {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentField = '';
                    } else {
                        currentField += char;
                    }
                    i++;
                }

                if (currentField || currentRow.length > 0) {
                    currentRow.push(currentField.trim());
                    if (currentRow.some(field => field.length > 0)) {
                        rows.push(currentRow);
                    }
                }
                return rows;
            };

            // Date parsing utility
            const parseDate = (dateStr) => {
                if (!dateStr) return null;

                // 2026-08-20
                const iso = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
                if (iso) {
                    return new Date(+iso[1], +iso[2] - 1, +iso[3]);
                }

                // 2026/8/20 或 2026.8.20
                const ymd = dateStr.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
                if (ymd) {
                    return new Date(+ymd[1], +ymd[2] - 1, +ymd[3]);
                }

                // 2026年8月20日
                const cjk = dateStr.match(/^(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?$/);
                if (cjk) {
                    return new Date(+cjk[1], +cjk[2] - 1, +cjk[3]);
                }

                // 20/8/2026：第一段大於 12 才敢判定為「日在前」，否則交給瀏覽器（美式月在前）
                const dmy = dateStr.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);
                if (dmy && +dmy[1] > 12) {
                    return new Date(+dmy[3], +dmy[2] - 1, +dmy[1]);
                }

                // Google 試算表序號
                const serial = parseFloat(dateStr);
                if (!isNaN(serial) && String(serial) === dateStr.trim() && serial > 25569) {
                    const utc = new Date((serial - 25569) * 86400 * 1000);
                    return new Date(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate());
                }

                const date = new Date(dateStr);
                return isNaN(date.getTime()) ? null : date;
            };

            // Column letter to index conversion
            const colToIndex = (col) => {
                let index = 0;
                for (let i = 0; i < col.length; i++) {
                    index = index * 26 + (col.charCodeAt(i) - 65 + 1);
                }
                return index - 1;
            };

            // Fetch data from Google Sheets
            const fetchSheetData = async (source) => {
                if (!source.sheetId) return { items: [], read: 0, skipped: [] };
                try {
                    const sheetParam = source.sheetName ? `&sheet=${encodeURIComponent(source.sheetName)}` : '';
                    const url = `https://docs.google.com/spreadsheets/d/${source.sheetId}/gviz/tq?${sheetParam}&range=A${source.headerRow}:Z&tqx=out:csv`;
                    const response = await fetch(url, { cache: 'no-store' });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const csvText = await response.text();
                    const rows = parseCSV(csvText);
                    const nameIdx = colToIndex(source.nameCol);
                    const expiryIdx = colToIndex(source.expiryCol);
                    const qtyIdx = colToIndex(source.qtyCol);
                    const items = [];
                    // 記下每一列的去向，才能跟試算表對帳
                    const skipped = [];

                    rows.forEach((row, i) => {
                        const name = row[nameIdx]?.trim();
                        const expiryStr = row[expiryIdx]?.trim();
                        const qtyStr = row[qtyIdx]?.trim();
                        // 第一列是標題列，不算略過
                        if (i === 0) return;

                        if (!name && !expiryStr && !qtyStr) return;

                        if (!name) {
                            skipped.push({ reason: '缺品名', detail: expiryStr || '（空白列）' });
                            return;
                        }
                        if (!expiryStr) {
                            skipped.push({ reason: '缺效期', detail: name });
                            return;
                        }

                        const expiry = parseDate(expiryStr);
                        if (!expiry) {
                            skipped.push({ reason: '效期讀不懂', detail: `${name}（${expiryStr}）` });
                            return;
                        }

                        // 數量可能帶千分位逗號或空白，先洗掉再轉數字
                        const qty = parseFloat(String(qtyStr || '').replace(/[,\s]/g, ''));
                        items.push({ name, expiry, qty: isNaN(qty) ? 0 : qty });
                    });

                    return { items, read: items.length, skipped };
                } catch (error) {
                    console.error(`[${source.name}] Error fetching data:`, error);
                    setErrors(prev => prev.includes(source.name) ? prev : [...prev, source.name]);
                    return { items: [], read: 0, skipped: [] };
                }
            };

            // Fetch all data and aggregate
            const fetchAllData = async (srcOverride) => {
                const srcs = Array.isArray(srcOverride) ? srcOverride : sources;
                setLoading(true);
                setErrors([]);
                try {
                    const results = await Promise.all(srcs.map(fetchSheetData));
                    // 以「品名 + 效期」為單位保留批次，不再把不同效期壓成一列
                    const batchMap = new Map();

                    results.forEach((result, sourceIndex) => {
                        const sourceName = srcs[sourceIndex].name;
                        result.items.forEach(item => {
                            const key = `${item.name}|${item.expiry.getTime()}`;
                            let batch = batchMap.get(key);
                            if (!batch) {
                                batch = {
                                    name: item.name,
                                    expiry: item.expiry,
                                    qty_TPE: 0,
                                    qty_SC: 0,
                                    qty_MOMO: 0
                                };
                                batchMap.set(key, batch);
                            }
                            if (sourceName === 'TPE') batch.qty_TPE += item.qty;
                            else if (sourceName === 'SC') batch.qty_SC += item.qty;
                            else if (sourceName === 'MOMO') batch.qty_MOMO += item.qty;
                        });
                    });

                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    const allBatches = Array.from(batchMap.values());
                    const batches = allBatches
                        // 三倉都是 0 的批次不必看，留著只會膨脹品項數
                        .filter(batch => batch.qty_TPE !== 0 || batch.qty_SC !== 0 || batch.qty_MOMO !== 0)
                        .map(batch => ({
                            ...batch,
                            qty_TTQ: batch.qty_TPE + batch.qty_SC + batch.qty_MOMO,
                            dte: Math.floor((batch.expiry.getTime() - today.getTime()) / (1000 * 60 * 60 * 24))
                        }));

                    setData(batches);
                    setDiag(srcs.map((s, i) => ({
                        name: s.name,
                        read: results[i].read,
                        skipped: results[i].skipped
                    })));
                    setZeroHidden(allBatches.length - batches.length);
                    setLastFetch(new Date());
                } catch (error) {
                    console.error('Error fetching data:', error);
                } finally {
                    setLoading(false);
                }
            };

            // Initial data load
            useEffect(() => {
                fetchAllData();
            }, []);

            // DTE 是抓資料當下算的。頁面開一整天會過期，跨日或回到分頁時自動重抓
            useEffect(() => {
                const stale = () => !lastFetch || fmtDate(lastFetch) !== fmtDate(new Date());
                const onVisible = () => {
                    if (document.visibilityState === 'visible' && stale()) fetchAllData();
                };
                document.addEventListener('visibilitychange', onVisible);
                const timer = setInterval(() => { if (stale()) fetchAllData(); }, 5 * 60 * 1000);
                return () => {
                    document.removeEventListener('visibilitychange', onVisible);
                    clearInterval(timer);
                };
            }, [lastFetch, sources]);

            // 目前勾選的倉別對應到哪幾個數量欄位
            const selectedKeys = useMemo(() => (
                locationFilter.includes('ALL')
                    ? ['qty_TPE', 'qty_SC', 'qty_MOMO']
                    : [
                        locationFilter.includes('TAIPEI') && 'qty_TPE',
                        locationFilter.includes('SANCHONG') && 'qty_SC',
                        locationFilter.includes('MOMO') && 'qty_MOMO'
                      ].filter(Boolean)
            ), [locationFilter]);

            // 只套品名與倉別的批次，效期分層統計用這一份（不受效期篩選影響）
            const scopedBatches = useMemo(() => {
                let filtered = data.slice();

                if (searchTerm) {
                    filtered = filtered.filter(item =>
                        item.name.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                if (!locationFilter.includes('ALL')) {
                    filtered = filtered.filter(item =>
                        selectedKeys.some(k => item[k] > 0)
                    );
                }

                return filtered;
            }, [data, searchTerm, locationFilter, selectedKeys]);

            // 再套效期篩選，仍是批次層級
            const filteredBatches = useMemo(() => {
                let filtered = scopedBatches;

                if (dteFilter === '≤90') {
                    filtered = filtered.filter(item => item.dte <= 90);
                } else if (dteFilter === '≤180') {
                    filtered = filtered.filter(item => item.dte <= 180);
                } else if (dteFilter === '≤365') {
                    filtered = filtered.filter(item => item.dte <= 365);
                } else if (dteFilter === '>365') {
                    filtered = filtered.filter(item => item.dte > 365);
                } else if (dteFilter === '≥548') {
                    filtered = filtered.filter(item => item.dte >= 548);
                } else if (dteFilter === '≥730') {
                    filtered = filtered.filter(item => item.dte >= 730);
                } else if (dteFilter === '≥913') {
                    filtered = filtered.filter(item => item.dte >= 913);
                } else if (dteFilter === 'custom') {
                    const rawMin = parseInt(customDteMin, 10);
                    const rawMax = parseInt(customDteMax, 10);
                    // 空白或亂打視為不設限；min > max 時自動對調，不讓畫面變空
                    let min = Number.isFinite(rawMin) ? rawMin : -Infinity;
                    let max = Number.isFinite(rawMax) ? rawMax : Infinity;
                    if (min > max) [min, max] = [max, min];
                    filtered = filtered.filter(item => item.dte >= min && item.dte <= max);
                }

                return filtered;
            }, [scopedBatches, dteFilter, customDteMin, customDteMax]);

            // 收攏成一列一品名，數量只算符合目前效期篩選的批次
            const filteredAndSortedData = useMemo(() => {
                const productMap = new Map();

                filteredBatches.forEach(batch => {
                    let product = productMap.get(batch.name);
                    if (!product) {
                        product = {
                            name: batch.name,
                            expiry: batch.expiry,
                            qty_TPE: 0,
                            qty_SC: 0,
                            qty_MOMO: 0,
                            batches: []
                        };
                        productMap.set(batch.name, product);
                    }
                    if (batch.expiry < product.expiry) product.expiry = batch.expiry;
                    product.qty_TPE += batch.qty_TPE;
                    product.qty_SC += batch.qty_SC;
                    product.qty_MOMO += batch.qty_MOMO;
                    product.batches.push(batch);
                });

                const products = Array.from(productMap.values()).map(product => ({
                    ...product,
                    qty_TTQ: product.qty_TPE + product.qty_SC + product.qty_MOMO,
                    dte: Math.min(...product.batches.map(b => b.dte)),
                    batches: product.batches.slice().sort((a, b) => a.dte - b.dte)
                }));

                // 只選部分倉時，TTQ 欄顯示的是所選倉合計，排序要跟著同一個數字走
                const shownTotal = (item) => selectedKeys.reduce((sum, k) => sum + item[k], 0);

                products.sort((a, b) => {
                    let aVal = a[sortField];
                    let bVal = b[sortField];
                    if (sortField === 'expiry') {
                        aVal = a.expiry.getTime();
                        bVal = b.expiry.getTime();
                    } else if (sortField === 'qty_TTQ') {
                        aVal = shownTotal(a);
                        bVal = shownTotal(b);
                    }
                    if (typeof aVal === 'string' && typeof bVal === 'string') {
                        aVal = aVal.toLowerCase();
                        bVal = bVal.toLowerCase();
                    }
                    if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
                return products;
            }, [filteredBatches, selectedKeys, sortField, sortDirection]);

            // Get selected location columns for dynamic display
            const selectedLocationColumns = useMemo(() => {
                if (locationFilter.includes('ALL')) {
                    return [
                        { key: 'qty_TPE', label: 'TPE', filterKey: 'TAIPEI' },
                        { key: 'qty_SC', label: 'SC', filterKey: 'SANCHONG' },
                        { key: 'qty_MOMO', label: 'MOMO', filterKey: 'MOMO' }
                    ];
                }
                
                const columns = [];
                if (locationFilter.includes('TAIPEI')) {
                    columns.push({ key: 'qty_TPE', label: 'TPE', filterKey: 'TAIPEI' });
                }
                if (locationFilter.includes('SANCHONG')) {
                    columns.push({ key: 'qty_SC', label: 'SC', filterKey: 'SANCHONG' });
                }
                if (locationFilter.includes('MOMO')) {
                    columns.push({ key: 'qty_MOMO', label: 'MOMO', filterKey: 'MOMO' });
                }
                
                return columns;
            }, [locationFilter]);

            const totalSkipped = useMemo(
                () => diag.reduce((sum, d) => sum + d.skipped.length, 0),
                [diag]
            );

            const sumSelected = useCallback(
                (item) => selectedKeys.reduce((sum, k) => sum + item[k], 0),
                [selectedKeys]
            );

            // Calculate stats
            const stats = useMemo(() => ({
                sku: filteredAndSortedData.length,
                qty: filteredAndSortedData.reduce((sum, item) => sum + sumSelected(item), 0)
            }), [filteredAndSortedData, sumSelected]);

            // 四層到期壓力：只看品名與倉別範圍，不受效期篩選影響，所以四格加起來就是全貌
            const tierStats = useMemo(() => {
                const acc = {};
                TIERS.forEach(t => { acc[t.key] = { sku: new Set(), qty: 0 }; });
                scopedBatches.forEach(batch => {
                    const tier = tierOf(batch.dte);
                    if (!tier) return;
                    acc[tier.key].sku.add(batch.name);
                    acc[tier.key].qty += sumSelected(batch);
                });
                return TIERS.map(t => ({ ...t, sku: acc[t.key].sku.size, qty: acc[t.key].qty }));
            }, [scopedBatches, sumSelected]);

            // 點分層卡片＝把該層套成自訂區間
            const applyTier = (tier) => {
                setDteFilter('custom');
                setCustomDteMin(Number.isFinite(tier.min) ? String(tier.min) : '');
                setCustomDteMax(Number.isFinite(tier.max) ? String(tier.max) : '');
            };

            // 匯出目前篩出來的批次，給倉庫盤點或促銷清單直接用
            const exportCSV = () => {
                const cols = selectedLocationColumns;
                const header = ['品名', '效期', 'DTE', ...cols.map(c => c.label), '合計'];
                const lines = [header];
                filteredAndSortedData.forEach(product => {
                    product.batches.forEach(batch => {
                        lines.push([
                            batch.name,
                            fmtDate(batch.expiry),
                            batch.dte,
                            ...cols.map(c => batch[c.key]),
                            sumSelected(batch)
                        ]);
                    });
                });
                const csv = lines
                    .map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
                    .join('\r\n');
                // BOM 讓 Excel 直接開不會變亂碼
                const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `inventory_${fmtDate(new Date())}.csv`;
                a.click();
                URL.revokeObjectURL(a.href);
            };

            const toggleExpanded = (name) => {
                setExpanded(prev => ({ ...prev, [name]: !prev[name] }));
            };

            // Handle sorting
            const handleSort = (field) => {
                if (sortField === field) {
                    setSortDirection(sortDirection === 'asc' ? 'desc' : 'asc');
                } else {
                    setSortField(field);
                    setSortDirection('asc');
                }
            };

            // Get DTE status class
            const getDTEStatusClass = (dte) => {
                const tier = tierOf(dte);
                return tier ? tier.cls : '';
            };

            return (
                <div className="min-h-screen bg-gray-50 p-3 sm:p-4">
                    <div className="max-w-7xl mx-auto space-y-3 sm:space-y-5">
                        {/* Header */}
                        <div className="flex items-center justify-between gap-2">
                            <h1 className="text-xl sm:text-3xl font-bold">庫存水位儀表板</h1>
                            <div className="flex items-center gap-2 shrink-0">
                                {lastFetch && (
                                    <span className="hidden sm:inline text-sm opacity-60">
                                        Last updated: {lastFetch.toLocaleTimeString()}
                                    </span>
                                )}
                                <button className="btn btn-outline p-2" onClick={fetchAllData} disabled={loading}>
                                    <RefreshCw className={`h-4 w-4 ${loading ? 'animate-spin' : ''}`} />
                                </button>
                                <button className="btn btn-outline p-2" onClick={() => setShowSettings(!showSettings)}>
                                    <Settings className="h-4 w-4" />
                                </button>
                            </div>
                        </div>

                        {/* Settings Panel */}
                        {showSettings && (
                            <div className="card rounded-lg p-6 space-y-6">
                                <h2 className="text-xl font-semibold">Data Source Settings</h2>
                                {sources.map((source, index) => (
                                    <div key={source.name} className="space-y-4 p-4 border rounded-lg">
                                        <h3 className="font-semibold">{source.name}</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium mb-1">Sheet ID/URL</label>
                                                <input
                                                    className="input"
                                                    value={source.sheetId}
                                                    onChange={(e) => {
                                                        const newSources = [...sources];
                                                        let value = e.target.value;
                                                        const match = value.match(/\/d\/([a-zA-Z0-9-_]+)/);
                                                        if (match) value = match[1];
                                                        newSources[index].sheetId = value;
                                                        setSources(newSources);
                                                    }}
                                                    placeholder="Sheet ID or full URL"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-1">Sheet Name</label>
                                                <input
                                                    className="input"
                                                    value={source.sheetName}
                                                    onChange={(e) => {
                                                        const newSources = [...sources];
                                                        newSources[index].sheetName = e.target.value;
                                                        setSources(newSources);
                                                    }}
                                                    placeholder="Leave blank for first tab"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-1">Header Row</label>
                                                <input
                                                    className="input"
                                                    type="number"
                                                    value={source.headerRow}
                                                    onChange={(e) => {
                                                        const newSources = [...sources];
                                                        newSources[index].headerRow = parseInt(e.target.value) || 1;
                                                        setSources(newSources);
                                                    }}
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-1">Name Column</label>
                                                <input
                                                    className="input"
                                                    value={source.nameCol}
                                                    onChange={(e) => {
                                                        const newSources = [...sources];
                                                        newSources[index].nameCol = e.target.value.toUpperCase();
                                                        setSources(newSources);
                                                    }}
                                                    placeholder="D"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-1">Expiry Column</label>
                                                <input
                                                    className="input"
                                                    value={source.expiryCol}
                                                    onChange={(e) => {
                                                        const newSources = [...sources];
                                                        newSources[index].expiryCol = e.target.value.toUpperCase();
                                                        setSources(newSources);
                                                    }}
                                                    placeholder="E"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-1">Quantity Column</label>
                                                <input
                                                    className="input"
                                                    value={source.qtyCol}
                                                    onChange={(e) => {
                                                        const newSources = [...sources];
                                                        newSources[index].qtyCol = e.target.value.toUpperCase();
                                                        setSources(newSources);
                                                    }}
                                                    placeholder="J"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                <div className="flex gap-2">
                                    <button
                                        className="btn btn-outline flex-1 py-2"
                                        onClick={() => {
                                            try { localStorage.setItem(SOURCES_KEY, JSON.stringify(sources)); } catch (e) { /* 無痕模式忽略 */ }
                                            setShowSettings(false);
                                            fetchAllData();
                                        }}
                                    >
                                        儲存並重新載入
                                    </button>
                                    <button
                                        className="btn btn-outline px-4 py-2"
                                        onClick={() => {
                                            try { localStorage.removeItem(SOURCES_KEY); } catch (e) { /* 同上 */ }
                                            const fresh = defaultSources.map(s => ({ ...s }));
                                            setSources(fresh);
                                            setShowSettings(false);
                                            fetchAllData(fresh);
                                        }}
                                    >
                                        還原預設
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Toolbar */}
                        <div className="card rounded-lg p-3 sm:p-4">
                            <div className="flex flex-col lg:flex-row gap-2 sm:gap-4 items-stretch lg:items-center">
                                <div className="flex-1 relative">
                                    <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 h-4 w-4 opacity-50" />
                                    <input
                                        className="input pl-10"
                                        placeholder="搜尋品名"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>

                                <div className="flex gap-2">
                                    <LocationMultiSelect 
                                        locationFilter={locationFilter}
                                        setLocationFilter={setLocationFilter}
                                    />
                                    
                                    <select
                                        className="select-trigger flex-1 lg:flex-none lg:w-32"
                                        value={dteFilter}
                                        onChange={(e) => setDteFilter(e.target.value)}
                                    >
                                        <option value="ALL">全部效期</option>
                                        <option value="≤90">≤90天</option>
                                        <option value="≤180">≤180天</option>
                                        <option value="≤365">≤365天</option>
                                        <option value=">365">>365天</option>
                                        <option value="≥548">≥548天</option>
                                        <option value="≥730">≥730天</option>
                                        <option value="≥913">≥913天</option>
                                        <option value="custom">自訂區間</option>
                                    </select>

                                    <button
                                        className="btn btn-outline px-3 shrink-0"
                                        onClick={exportCSV}
                                        disabled={filteredAndSortedData.length === 0}
                                        title="匯出目前篩選結果（批次層級）"
                                    >
                                        匯出
                                    </button>
                                </div>
                            </div>

                            <div className="text-xs opacity-60 mt-2">
                                數量為符合目前效期篩選的批次合計，點品名展開各批。
                            </div>

                            {dteFilter === 'custom' && (
                                <div className="flex flex-wrap items-center gap-2 mt-3 pt-3 border-t">
                                    <span className="text-sm opacity-60 shrink-0">DTE 天數</span>
                                    <input
                                        className="input w-20 sm:w-28"
                                        type="number"
                                        placeholder="最小"
                                        value={customDteMin}
                                        onChange={(e) => setCustomDteMin(e.target.value)}
                                    />
                                    <span className="text-sm opacity-60">到</span>
                                    <input
                                        className="input w-20 sm:w-28"
                                        type="number"
                                        placeholder="最大"
                                        value={customDteMax}
                                        onChange={(e) => setCustomDteMax(e.target.value)}
                                    />
                                    <button
                                        className="btn btn-outline px-3 h-10 shrink-0"
                                        onClick={() => { setCustomDteMin(''); setCustomDteMax(''); }}
                                    >
                                        清空
                                    </button>
                                    <span className="text-xs sm:text-sm opacity-60 w-full sm:w-auto">
                                        留空＝不設限，可用負數看已過期
                                    </span>
                                </div>
                            )}
                        </div>

                        {errors.length > 0 && (
                            <div className="card rounded-lg p-3 text-sm" style={{ borderColor: 'hsl(var(--destructive))' }}>
                                以下來源讀取失敗，數字不完整：{errors.join('、')}。請確認試算表仍為「知道連結的人可檢視」，再按重新整理。
                            </div>
                        )}

                        {/* 對帳列：讀進來幾筆、略過幾筆、為什麼略過 */}
                        {diag.length > 0 && (
                            <div className="card rounded-lg px-3 py-2 text-xs">
                                <div className="flex items-center justify-between gap-2 flex-wrap">
                                    <span className="opacity-70">
                                        讀入 {diag.map(d => `${d.name} ${d.read}`).join('　')}
                                        {zeroHidden > 0 && `　（0 件已隱藏 ${zeroHidden} 批）`}
                                    </span>
                                    {totalSkipped > 0 ? (
                                        <button
                                            className="btn btn-ghost px-2 py-1 text-xs text-orange-600 font-medium"
                                            onClick={() => setShowDiag(!showDiag)}
                                        >
                                            略過 {totalSkipped} 筆，點開看原因
                                            {showDiag ? <ChevronUp className="h-3 w-3 ml-1" /> : <ChevronDown className="h-3 w-3 ml-1" />}
                                        </button>
                                    ) : (
                                        <span className="opacity-50">沒有略過任何列</span>
                                    )}
                                </div>
                                {showDiag && totalSkipped > 0 && (
                                    <div className="mt-2 pt-2 border-t space-y-1 max-h-48 overflow-y-auto">
                                        {diag.filter(d => d.skipped.length).map(d => (
                                            <div key={d.name}>
                                                <div className="font-medium">{d.name}　略過 {d.skipped.length} 筆</div>
                                                {d.skipped.slice(0, 30).map((s, i) => (
                                                    <div key={i} className="opacity-70 pl-3">
                                                        {s.reason}：{s.detail}
                                                    </div>
                                                ))}
                                                {d.skipped.length > 30 && (
                                                    <div className="opacity-50 pl-3">還有 {d.skipped.length - 30} 筆</div>
                                                )}
                                            </div>
                                        ))}
                                        <div className="opacity-60 pt-1">
                                            這些列沒有進入上面的數字，去試算表把效期或品名補好再按重新整理。
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 到期壓力分層（點一下就套成該區間） */}
                        <div className="grid grid-cols-4 gap-2 sm:gap-4">
                            {tierStats.map(tier => {
                                const active = dteFilter === 'custom'
                                    && customDteMin === (Number.isFinite(tier.min) ? String(tier.min) : '')
                                    && customDteMax === (Number.isFinite(tier.max) ? String(tier.max) : '');
                                return (
                                    <div
                                        key={tier.key}
                                        className={`card tier-card rounded-lg p-2 sm:p-4 ${tier.cls}`}
                                        data-active={active}
                                        onClick={() => applyTier(tier)}
                                    >
                                        <div className="text-xs sm:text-sm font-medium leading-tight whitespace-nowrap">
                                            <span className="sm:hidden">{tier.short}</span>
                                            <span className="hidden sm:inline">{tier.label}</span>
                                        </div>
                                        <div className="text-lg sm:text-2xl font-bold leading-tight sm:mt-1">{tier.qty.toLocaleString()}</div>
                                        <div className="text-xs opacity-80 leading-tight">{tier.sku} 品項</div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="text-xs opacity-50 -mt-1">
                            四層的件數加起來等於總件數；品項數會加起來比總品項數多，因為同一品項的不同批可能落在不同層。
                        </div>

                        {/* Stats：手機壓成一行摘要，桌機維持三張卡 */}
                        <div className="card rounded-lg px-3 py-2 flex items-center justify-between gap-2 text-xs md:hidden">
                            <span><span className="font-bold text-sm">{stats.sku.toLocaleString()}</span> 品項</span>
                            <span><span className="font-bold text-sm">{stats.qty.toLocaleString()}</span> 件</span>
                            <span className="opacity-70 truncate">
                                最早 {filteredAndSortedData.length
                                    ? `${fmtDate(filteredAndSortedData.reduce((e, i) => !e || i.expiry < e.expiry ? i : e, null).expiry)}`
                                    : '無'}
                            </span>
                        </div>

                        <div className="hidden md:grid grid-cols-3 gap-4 items-start">
                            <div className="card rounded-lg p-4">
                                <div className="text-2xl font-bold">{stats.sku.toLocaleString()}</div>
                                <div className="text-sm opacity-60">SKU Count</div>
                            </div>
                            <div className="card rounded-lg p-4">
                                <div className="text-2xl font-bold">{stats.qty.toLocaleString()}</div>
                                <div className="text-sm opacity-60">Total Quantity (TTQ)</div>
                            </div>
                            <div className="card rounded-lg p-4">
                                <EarliestExpiryCollapsible data={filteredAndSortedData} />
                                <div className="text-sm opacity-60 mt-2">Earliest Expiry</div>
                            </div>
                        </div>

                        {/* 手機版清單：一列一品項，DTE 徽章永遠看得到，不用左右滑 */}
                        <div className="card rounded-lg md:hidden">
                            <div className="flex items-center gap-3 px-3 py-2 border-b text-xs opacity-70">
                                <span>排序</span>
                                {[
                                    { field: 'dte', label: '效期' },
                                    { field: 'qty_TTQ', label: '數量' },
                                    { field: 'name', label: '品名' }
                                ].map(opt => (
                                    <button
                                        key={opt.field}
                                        className={`btn btn-ghost px-2 py-1 ${sortField === opt.field ? 'font-bold text-blue-600' : ''}`}
                                        onClick={() => handleSort(opt.field)}
                                    >
                                        {opt.label}{sortField === opt.field ? (sortDirection === 'asc' ? ' ↑' : ' ↓') : ''}
                                    </button>
                                ))}
                            </div>

                            {loading ? (
                                <div className="p-6 text-center text-sm flex items-center justify-center gap-2">
                                    <RefreshCw className="h-4 w-4 animate-spin" /> 讀取中
                                </div>
                            ) : filteredAndSortedData.length === 0 ? (
                                <div className="p-6 text-center text-sm opacity-60">這個條件下沒有庫存</div>
                            ) : (
                                filteredAndSortedData.map(item => {
                                    const isOpen = !!expanded[item.name];
                                    return (
                                        <div key={item.name} className="border-b last:border-b-0">
                                            <div className="px-3 py-2" onClick={() => toggleExpanded(item.name)}>
                                                <div className="flex items-start justify-between gap-2">
                                                    <div className="font-medium text-sm leading-snug">
                                                        {item.name}
                                                        {item.batches.length > 1 && (
                                                            <span className="text-xs opacity-50 ml-1">{item.batches.length} 批</span>
                                                        )}
                                                    </div>
                                                    <span className={`shrink-0 px-2 py-0.5 rounded text-xs font-medium ${getDTEStatusClass(item.dte)}`}>
                                                        {item.dte < 0 && <AlertTriangle className="inline h-3 w-3 mr-1" />}
                                                        {item.dte} 天
                                                    </span>
                                                </div>
                                                <div className="flex items-center justify-between gap-2 mt-1 text-xs opacity-70">
                                                    <span>
                                                        {selectedLocationColumns.map(c => `${c.label} ${item[c.key].toLocaleString()}`).join('　')}
                                                    </span>
                                                    <span className="font-bold text-blue-600 shrink-0">
                                                        {sumSelected(item).toLocaleString()} 件
                                                    </span>
                                                </div>
                                            </div>
                                            {isOpen && (
                                                <div className="px-3 pb-2 space-y-1">
                                                    {item.batches.map(batch => (
                                                        <div key={batch.expiry.getTime()} className="batch-row rounded px-2 py-1 text-xs">
                                                            <div className="flex items-center justify-between gap-2">
                                                                <span className="opacity-70 whitespace-nowrap">效期 {fmtDate(batch.expiry)}</span>
                                                                <span className={`px-1.5 py-0.5 rounded shrink-0 ${getDTEStatusClass(batch.dte)}`}>{batch.dte} 天</span>
                                                            </div>
                                                            <div className="opacity-70 mt-0.5">
                                                                {selectedLocationColumns.map(c => `${c.label} ${batch[c.key].toLocaleString()}`).join('　')}
                                                                <span className="font-medium">　合計 {sumSelected(batch).toLocaleString()}</span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })
                            )}
                        </div>

                        {/* Data Table（桌機） */}
                        <div className="card rounded-lg hidden md:block">
                            <div className="overflow-x-auto">
                                <table className="w-full data-table">
                                    <thead>
                                        <tr>
                                            <th className="p-3 text-left font-medium">
                                                <button onClick={() => handleSort('name')} className="hover:text-blue-600">
                                                    # Item {sortField === 'name' && (sortDirection === 'asc' ? '↑' : '↓')}
                                                </button>
                                            </th>
                                            {selectedLocationColumns.map(column => (
                                                <th key={column.key} className="p-3 text-right font-medium">
                                                    <button onClick={() => handleSort(column.key)} className="hover:text-blue-600">
                                                        {column.label} {sortField === column.key && (sortDirection === 'asc' ? '↑' : '↓')}
                                                    </button>
                                                </th>
                                            ))}
                                            {selectedLocationColumns.length > 1 && (
                                                <th className="p-3 text-right font-medium">
                                                    <button onClick={() => handleSort('qty_TTQ')} className="hover:text-blue-600">
                                                        TTQ {sortField === 'qty_TTQ' && (sortDirection === 'asc' ? '↑' : '↓')}
                                                    </button>
                                                </th>
                                            )}
                                            <th className="p-3 text-right font-medium">
                                                <button onClick={() => handleSort('dte')} className="hover:text-blue-600">
                                                    DTE {sortField === 'dte' && (sortDirection === 'asc' ? '↑' : '↓')}
                                                </button>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {loading ? (
                                            <tr>
                                                <td colSpan={2 + selectedLocationColumns.length + (selectedLocationColumns.length > 1 ? 1 : 0)} className="p-8 text-center">
                                                    <div className="flex items-center justify-center gap-2">
                                                        <RefreshCw className="h-4 w-4 animate-spin" />
                                                        Loading data...
                                                    </div>
                                                </td>
                                            </tr>
                                        ) : filteredAndSortedData.length === 0 ? (
                                            <tr>
                                                <td colSpan={2 + selectedLocationColumns.length + (selectedLocationColumns.length > 1 ? 1 : 0)} className="p-8 text-center opacity-60">
                                                    No data available
                                                </td>
                                            </tr>
                                        ) : (
                                            filteredAndSortedData.map((item, index) => {
                                                const isOpen = !!expanded[item.name];
                                                const multiBatch = item.batches.length > 1;
                                                return (
                                                    <React.Fragment key={`${item.name}-${index}`}>
                                                        <tr className="border-t hover:bg-gray-50">
                                                            <td className="p-3">
                                                                <button
                                                                    className="btn btn-ghost p-0 h-auto text-left"
                                                                    onClick={() => toggleExpanded(item.name)}
                                                                >
                                                                    <span className="font-medium">{item.name}</span>
                                                                    <span className="text-xs opacity-60 ml-2">
                                                                        {item.batches.length} 批
                                                                    </span>
                                                                    {isOpen
                                                                        ? <ChevronUp className="h-3 w-3 ml-1 opacity-60" />
                                                                        : <ChevronDown className="h-3 w-3 ml-1 opacity-60" />}
                                                                </button>
                                                            </td>
                                                            {selectedLocationColumns.map(column => (
                                                                <td key={column.key} className="p-3 text-right font-medium">
                                                                    {item[column.key].toLocaleString()}
                                                                </td>
                                                            ))}
                                                            {selectedLocationColumns.length > 1 && (
                                                                <td className="p-3 text-right font-bold text-blue-600">
                                                                    {sumSelected(item).toLocaleString()}
                                                                </td>
                                                            )}
                                                            <td className="p-3 text-right">
                                                                <span className={`px-2 py-1 rounded text-xs font-medium ${getDTEStatusClass(item.dte)}`}>
                                                                    {item.dte < 0 && <AlertTriangle className="inline h-3 w-3 mr-1" />}
                                                                    {item.dte}
                                                                </span>
                                                                {multiBatch && (
                                                                    <div className="text-xs opacity-50 mt-1">最早批</div>
                                                                )}
                                                            </td>
                                                        </tr>
                                                        {isOpen && item.batches.map(batch => (
                                                            <tr key={`${item.name}-${batch.expiry.getTime()}`} className="batch-row border-t">
                                                                <td className="p-2 pl-8 text-xs opacity-70">
                                                                    效期 {fmtDate(batch.expiry)}
                                                                </td>
                                                                {selectedLocationColumns.map(column => (
                                                                    <td key={column.key} className="p-2 text-right text-xs">
                                                                        {batch[column.key].toLocaleString()}
                                                                    </td>
                                                                ))}
                                                                {selectedLocationColumns.length > 1 && (
                                                                    <td className="p-2 text-right text-xs font-medium">
                                                                        {sumSelected(batch).toLocaleString()}
                                                                    </td>
                                                                )}
                                                                <td className="p-2 text-right">
                                                                    <span className={`px-2 py-0.5 rounded text-xs ${getDTEStatusClass(batch.dte)}`}>
                                                                        {batch.dte}
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </React.Fragment>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="text-xs opacity-50 text-right">
                            {lastFetch && (
                                <span className="sm:hidden">資料讀取 {lastFetch.toLocaleTimeString()}　</span>
                            )}
                            最後更新 2026/07/27 22:10
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<PMInventoryDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
