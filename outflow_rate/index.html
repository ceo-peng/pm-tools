<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出貨量 vs 庫存 警示表 v52</title>
    <script src="https://cdn.tailwindcss.com"></script>
<style>
    :root{
        --bg:#f6f7f9; --card:#ffffff; --line:#e6e8ec; --line-soft:#f1f3f5;
        --ink:#101828; --ink-2:#475467; --ink-3:#98a2b3;
        --accent:#4f46e5; --accent-soft:#eef2ff;
        --risk-bg:#fef1f2; --risk-ink:#be123c;
        --ok-bg:#ecfdf3; --ok-ink:#067647;
    }
    *{box-sizing:border-box;}
    body{
        margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
        -webkit-font-smoothing:antialiased;
        font-size:14px; line-height:1.45;
    }
    .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}

    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-thumb{background:#d0d5dd;border-radius:4px;}
    ::-webkit-scrollbar-track{background:transparent;}

    /* ---- Header ---- */
    .hd{background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0;}
    .hd-in{display:flex;align-items:center;justify-content:space-between;gap:12px;
           padding:10px 14px;max-width:1200px;margin:0 auto;}
    .logo{background:var(--accent);color:#fff;font-weight:700;font-size:14px;
          width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
    .title{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2;}
    .sub{font-size:11px;color:var(--ink-3);margin-top:1px;}
    .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);
              color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
    .icon-btn:hover{background:var(--line-soft);color:var(--ink);}
    .icon-btn svg{width:17px;height:17px;}

    /* ---- Toolbar ---- */
    .tb{background:var(--card);border-bottom:1px solid var(--line);}
    .tb-in{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
    .tb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

    /* 分段控制：品項 / 產品 */
    .seg{display:inline-flex;background:var(--line-soft);border:1px solid var(--line);
         border-radius:9px;padding:2px;flex:none;}
    .seg button{appearance:none;border:0;background:transparent;cursor:pointer;
                font-size:13px;font-weight:500;color:var(--ink-2);
                padding:6px 14px;border-radius:7px;white-space:nowrap;transition:background .15s,color .15s;}
    .seg button.on{background:var(--card);color:var(--ink);font-weight:600;
                   box-shadow:0 1px 2px rgb(16 24 40 / .06);}

    .search{position:relative;flex:1;min-width:0;}
    .search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;
                  background:var(--card);padding:0 12px 0 32px;font-size:13px;color:var(--ink);outline:none;}
    .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
    .search svg{position:absolute;left:10px;top:10px;width:15px;height:15px;color:var(--ink-3);}

    .btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);
         color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;
         align-items:center;gap:6px;white-space:nowrap;flex:none;}
    .btn:hover{background:var(--line-soft);color:var(--ink);}
    .btn svg{width:15px;height:15px;}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
    .btn-primary:hover{background:#4338ca;color:#fff;}

    .basis{font-size:11.5px;color:var(--ink-3);line-height:1.4;}

    /* ---- Table ---- */
    .wrap{flex:1;overflow:auto;}
    .wrap-in{max-width:1200px;margin:0 auto;padding:0 14px 24px;}
    table{width:100%;border-collapse:collapse;background:var(--card);
          border:1px solid var(--line);border-radius:10px;overflow:hidden;}
    thead th{position:sticky;top:0;z-index:2;background:#fbfcfd;
             font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;
             padding:9px 10px;text-align:right;white-space:nowrap;
             border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
    thead th:first-child{text-align:left;}
    thead th.name-col{text-align:left;width:100%;}
    thead th:hover{color:var(--accent);}
    thead th .arw{opacity:0;margin-left:3px;font-size:10px;}
    thead th:hover .arw{opacity:.35;}
    thead th.asc .arw,thead th.desc .arw{opacity:1;color:var(--accent);}
    thead th.desc .arw{display:inline-block;transform:rotate(180deg);}

    tbody td{padding:7px 10px;text-align:right;white-space:nowrap;
             border-top:1px solid var(--line-soft);font-size:13px;}
    tbody td:first-child{text-align:left;}
    tbody tr:hover td{background:#fafbfc;}
    tbody tr.risk td:first-child{box-shadow:inset 2px 0 0 var(--risk-ink);}

    .no{color:var(--ink-3);font-size:12px;}
    .nm{text-align:left;font-weight:500;color:var(--ink);white-space:normal;
        line-height:1.35;word-break:break-word;}
    /* 效期拆成第二行小字，窄螢幕不會把品名擠成好幾行 */
    .exp{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:1px;
         font-variant-numeric:tabular-nums;white-space:nowrap;}
    .out{color:var(--accent);font-weight:500;}
    .del{color:#d0d5dd;background:none;border:0;cursor:pointer;padding:2px 4px;font-size:13px;line-height:1;}
    .del:hover{color:var(--risk-ink);}

    .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;}
    .pill.risk{background:var(--risk-bg);color:var(--risk-ink);}
    .pill.ok{background:var(--ok-bg);color:var(--ok-ink);}

    /* ---- Loader / Modal ---- */
    .loader{border:2px solid var(--line);border-top:2px solid var(--accent);width:22px;height:22px;
            border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .modal{transition:opacity .18s ease-out;pointer-events:none;opacity:0;}
    .modal.active{pointer-events:auto;opacity:1;}
    .modal-content{transition:transform .18s ease-out;transform:scale(.98);}
    .modal.active .modal-content{transform:scale(1);}

    /* ---- 手機 ---- */
    @media (max-width:639px){
        .hd-in,.tb-in{padding:9px 12px;}
        .wrap-in{padding:0 12px 20px;}
        .tb-in{gap:8px;}
        .seg-view{flex:1 0 100%;}
        .seg-view button{flex:1;padding:7px 0;}
        #mult-seg button{padding:6px 12px;}
        .col-no,.col-del{display:none;}
        /* 手機第一欄是品名，紅色標記要跟著移過來 */
        tbody tr.risk td.nm{box-shadow:inset 2px 0 0 var(--risk-ink);}
        thead th{padding:8px;font-size:11px;}
        tbody td{padding:10px 8px;font-size:13px;}
        .nm{font-size:13.5px;font-weight:600;}
        .title{font-size:14px;}
    }

    /* 很窄的手機（iPhone SE 這類）再收一階，把寬度讓給品名 */
    @media (max-width:399px){
        thead th{padding:8px 5px;font-size:10.5px;}
        tbody td{padding:9px 5px;font-size:12.5px;}
        .nm{font-size:13px;}
        .exp{font-size:11px;}
        .pill{padding:2px 6px;font-size:11px;}
    }
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;">

    <header class="hd">
        <div class="hd-in">
            <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                <div class="logo">PM</div>
                <div style="min-width:0;">
                    <div class="title">出貨量 vs 庫存 警示表</div>
                    <div class="sub">v52 · <span id="status">讀取中</span></div>
                </div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="icon-btn" onclick="window.location.reload()" title="重新整理" aria-label="重新整理">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                </button>
                <button class="icon-btn" onclick="app.toggleSettings(true)" title="設定" aria-label="設定">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="tb">
        <div class="tb-in">
            <div class="tb-row">
                <div class="seg seg-view">
                    <button id="btn-view-sku" class="on" onclick="app.switchView('sku')">品項</button>
                    <button id="btn-view-product" onclick="app.switchView('product')">產品</button>
                    <button id="btn-view-year" onclick="app.switchView('year')">年量</button>
                </div>
                <div class="search">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" id="search" placeholder="搜尋品名">
                </div>
                <button class="btn" onclick="app.exportCSV()">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    匯出
                </button>
            </div>
            <div class="tb-row" id="mult-box" style="display:none;">
                <span style="font-size:13px;color:var(--ink-2);flex:none;">倍數</span>
                <div class="seg" id="mult-seg" style="flex:none;">
                    <button onclick="app.setMult(1)">1</button>
                    <button onclick="app.setMult(1.5)">1.5</button>
                    <button onclick="app.setMult(2)">2</button>
                </div>
                <input id="mult-input" type="number" step="0.1" min="0" value="1"
                       style="height:36px;width:80px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;">
                <span style="font-size:13px;color:var(--ink-2);margin-left:auto;white-space:nowrap;">
                    合計 <strong id="mult-total" class="num">0</strong> 件
                </span>
            </div>
            <div class="basis" id="debug-stats"></div>
        </div>
    </div>

    <div class="wrap">
        <div class="wrap-in">
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <div id="empty-state" class="hidden" style="padding:48px 0;text-align:center;color:var(--ink-3);font-size:13px;">沒有符合的項目</div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loader" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="loader mb-4"></div>
        <div style="font-size:13px;font-weight:600;color:#101828;">讀取中</div>
        <div style="font-size:12px;color:#98a2b3;margin-top:6px;">正在讀取 Google 試算表</div>
    </div>

    <!-- Debug Modal -->
    <div id="modal-debug" class="modal fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="app.closeModal()"></div>
        <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col relative z-10 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-slate-800 text-sm">Details</h3>
                <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="modal-content" class="p-5 overflow-y-auto font-mono text-xs space-y-4 bg-white"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="modal-settings" class="modal fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="app.toggleSettings(false)"></div>
        <div class="modal-content bg-white w-full max-w-md rounded-xl shadow-2xl z-10 p-5 relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-slate-800">Configuration</h2>
                <button onclick="app.toggleSettings(false)" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div class="space-y-4">
                <div class="grid grid-cols-1 gap-3">
                    <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Sheet ID</label><input id="conf-id" class="w-full p-2 text-xs border border-slate-200 rounded focus:ring-2 focus:ring-indigo-500"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tab Name</label><input id="conf-tab" class="w-full p-2 text-xs border border-slate-200 rounded focus:ring-2 focus:ring-indigo-500"></div>
                </div>
                
                <div class="bg-slate-50 rounded-lg p-3 border border-slate-100 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-700">Hidden Items</span>
                    <div class="text-xs"><span id="hidden-count" class="font-bold text-slate-600">0</span> hidden <button onclick="app.clearHidden()" class="text-indigo-600 hover:underline ml-2">Reset</button></div>
                </div>
            </div>
            <div class="mt-6 flex justify-end"><button onclick="app.saveSettings()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded text-xs shadow-md">Save</button></div>
        </div>
    </div>

    <script>
        // headers=2 讓 gviz 把第 1 列（進出貨類別）與第 2 列（時戳）合成欄位標題。
        // 用 headers=0 讀會拿不到，因為 gviz 把出貨欄判定為數字欄，文字儲存格會被丟掉。
        const CONFIG = { ID: '14yjT90s9CV988KZZ_o6m8F4LbeDWpKTuqVO66gfLboI', TAB: 'inventory_tracking', D_ROW: 1, SKU_IDX: 3, INV_IDX: 9, START_IDX: 11 };
        // 盤點是校正、退庫是退回台北倉的內部移動，兩者的負數都不是需求。
        // 進貨、歸倉、客退本來就只有正數，進不了分子，不必列。
        const NON_DEMAND = ['盤點', '退庫'];
        window.googleSheetCallback = function(json) {
            if (json.status === 'error') { alert("API Error: " + json.errors[0].detailed_message); app.toggleLoader(false); return; }
            const cols = json.table.cols.map(c => c.label || "");
            const rows = json.table.rows.map(r => r.c.map(cell => (cell && cell.v !== null) ? String(cell.v) : ""));
            app.process(rows, cols);
        };
        const safeStorage = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

        const app = {
            data: [], productData: [], sortCol: 'itemNo', sortAsc: true, hiddenSKUs: new Set(), view: 'sku', mult: 1,

            init() {
                this.hiddenSKUs = new Set(safeStorage.get('pm_hidden_skus'));
                document.getElementById('hidden-count').innerText = this.hiddenSKUs.size;
                this.bindEvents();
                this.fetchData();
            },

            setMult(v) {
                const n = parseFloat(v);
                this.mult = (isNaN(n) || n < 0) ? 1 : n;
                document.getElementById('mult-input').value = this.mult;
                document.querySelectorAll('#mult-seg button').forEach(b =>
                    b.className = parseFloat(b.innerText) === this.mult ? 'on' : '');
                this.render(document.getElementById('search').value);
            },

            bindEvents() { document.getElementById('search').addEventListener('input', (e) => this.render(e.target.value));
                document.getElementById('mult-input').addEventListener('input', (e) => this.setMult(e.target.value)); },
            switchView(mode) {
                this.view = mode;
                ['sku','product','year'].forEach(v =>
                    document.getElementById('btn-view-' + v).className = mode === v ? 'on' : '');
                document.getElementById('mult-box').style.display = mode === 'year' ? 'flex' : 'none';
                this.sort('itemNo', true); 
            },
            fetchData() {
                document.getElementById('loader').classList.remove('hidden');
                const s = document.createElement('script');
                s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.ID}/gviz/tq?sheet=${CONFIG.TAB}&headers=2&tqx=responseHandler:googleSheetCallback`;
                s.onerror = () => { alert("Network Error"); app.toggleLoader(false); };
                document.body.appendChild(s);
            },


            process(rows, cols) {
                try {
                    // 欄位標題長這樣：「官網 25.0907.2241」＝ 第 1 列類別 + 第 2 列時戳
                    const moves = [];
                    for (let i = CONFIG.START_IDX; i < cols.length; i++) {
                        const m = String(cols[i]).match(/^(.*?)\s*(\d{2})\.(\d{2})(\d{2})\.\d{4}\s*$/);
                        // 類別去掉所有空白再比對，「盤 點」這種手打的空格也擋得住
                        if (m) moves.push({ idx: i, cat: m[1].replace(/\s+/g, ''), ym: `20${m[2]}-${m[3]}` });
                    }

                    // 分母照原本的算法：最早到最晚跨幾個月，減 1 扣掉還沒過完的當月
                    const months = [...new Set(moves.map(x => x.ym))].sort();
                    const first = months[0], last = months[months.length - 1];
                    let denom = 1;
                    if (first && last) {
                        denom = Math.max(1, (+last.slice(0, 4) - +first.slice(0, 4)) * 12 + (+last.slice(5) - +first.slice(5)) + 1 - 1);
                    }
                    const demandCols = moves.filter(x => !NON_DEMAND.includes(x.cat)).map(x => x.idx);
                    const skipCols = moves.filter(x => NON_DEMAND.includes(x.cat)).map(x => x.idx);

                    let skipped = 0;
                    for (let i = CONFIG.D_ROW; i < rows.length; i++) {
                        for (const c of skipCols) {
                            const v = parseFloat(String(rows[i][c]).replace(/,/g, ''));
                            if (!isNaN(v) && v < 0) skipped += Math.abs(v);
                        }
                    }
                    document.getElementById('debug-stats').innerText =
                        `T: ${denom}m (${first} ~ ${last}) · 已排除 ${NON_DEMAND.join('/')} 共 ${Math.round(skipped).toLocaleString()} 件`;

                    const skuResults = [];
                    for(let i = CONFIG.D_ROW; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row[CONFIG.SKU_IDX]) continue;
                        const sku = String(row[CONFIG.SKU_IDX]).trim();
                        if (sku.toLowerCase().includes('unique_key') || sku.includes('sort_')) continue;
                        const itemNo = parseInt(row[0]) || 9999;
                        const invRaw = row[CONFIG.INV_IDX];
                        let inv = typeof invRaw === 'string' ? parseFloat(invRaw.replace(/,/g, '')) : (typeof invRaw === 'number' ? invRaw : 0);
                        // 只加需求欄位的出貨，盤點、退庫、歸倉、客退、進貨那幾欄跳過
                        let totalOut = 0;
                        for (const c of demandCols) {
                            const v = parseFloat(String(row[c]).replace(/,/g, ''));
                            if (!isNaN(v) && v < 0) totalOut += Math.abs(v);
                        }
                        const monthlyRate = Math.ceil(totalOut / denom);
                        // SKU View: show original SKU but allow line wrapping
                        const product = sku; 
                        let status = 'OK';
                        if (monthlyRate > 0 && (inv / monthlyRate) < 2) status = 'Risk';
                        skuResults.push({ itemNo, sku, name: product, inv: inv || 0, rawOutflow: totalOut, months: denom, runRate: monthlyRate, status });
                    }
                    this.data = skuResults;
                    this.aggregateProducts(skuResults);
                    document.getElementById('status').innerText =
                        `${skuResults.length} 個品項 · ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })} 更新`;
                    this.sort('itemNo', true); 
                    app.toggleLoader(false);
                } catch(e) {
                    alert("Processing Error: " + e.message);
                    app.toggleLoader(false);
                }
            },

            aggregateProducts(skuData) {
                const map = new Map();
                skuData.forEach(item => {
                    // For aggregation, we use the cleaned name
                    const cleanName = item.sku.replace(/\s*\(?\d{4}-\d{2}-\d{2}\)?.*$/, "").replace(/\s*-\s*$/, "").trim();
                    if(!map.has(cleanName)) map.set(cleanName, { name: cleanName, rawOutflow: 0, inv: 0, months: item.months });
                    const p = map.get(cleanName);
                    p.rawOutflow += item.rawOutflow;
                    p.inv += item.inv;
                });
                this.productData = Array.from(map.values()).map((p, i) => {
                  const runRate = Math.ceil(p.rawOutflow / p.months);
                  const status = (runRate > 0 && (p.inv / runRate) < 2) ? 'Risk' : 'OK';
                
                  return {
                    itemNo: i + 1,
                    name: p.name,
                    rawOutflow: p.rawOutflow,
                    inv: p.inv,
                    runRate,
                    status,     // ✅ 關鍵
                    months: p.months
                  };
                });
            },

            render(filterInput = '') {
                const term = (filterInput || document.getElementById('search').value).toLowerCase();
                const tbody = document.getElementById('table-body');
                const thead = document.getElementById('table-head');
                const empty = document.getElementById('empty-state');
                tbody.innerHTML = '';

                // HEADER RENDER
                const createHeader = (cols) => `<tr>${cols.map(c =>
                    `<th class="${c.k==='name'?'name-col':''}${c.k==='itemNo'?' col-no':''}"${c.k?` onclick="app.sort('${c.k}')"`:' style="cursor:default;"'}>${c.t}${c.k?'<span class="arw">▲</span>':''}</th>`
                ).join('')}${this.view==='sku'?'<th class="col-del"></th>':''}</tr>`;

                const cols = this.view === 'year'
                    ? [
                        {t:'#', k:'itemNo'},
                        {t:'產品', k:'name'},
                        {t:'月需', k:'runRate'},
                        {t:'年需求', k:null},
                        {t:'倍數後總量', k:null}
                      ]
                    : [
                        {t:'#', k:'itemNo'},
                        {t: this.view==='sku' ? '品項' : '產品', k:'name'},
                        {t:'總出', k:'rawOutflow'},
                        {t:'月需', k:'runRate'},
                        {t:'北倉', k:'inv'},
                        {t:'風險', k:'status'}
                      ];
                thead.innerHTML = createHeader(cols);

                const dataset = this.view === 'sku' ? this.data : this.productData;
                let visibleCount = 0;
                let yearSum = 0;

                dataset.forEach(row => {
                    if (this.view === 'sku' && this.hiddenSKUs.has(row.sku)) return;
                    if (term && !row.name.toLowerCase().includes(term) && !(row.sku && row.sku.toLowerCase().includes(term))) return;
                    
                    visibleCount++;
                    const tr = document.createElement('tr');

                    const nameHTML = (() => {
                        const m = String(row.name).match(/^(.*?)\s*\((\d{4}-\d{2}-\d{2})\)\s*$/);
                        return m ? `${m[1]}<span class="exp">效期 ${m[2]}</span>` : row.name;
                    })();

                    if (this.view === 'year') {
                        // 年量：純粹用月需推一年要多少，不看庫存；沒出貨的不列
                        if (!(row.runRate > 0)) { visibleCount--; return; }
                        const year = row.runRate * 12;
                        const total = Math.round(year * this.mult);
                        yearSum += total;
                        tr.innerHTML = `
                            <td class="no num col-no">${row.itemNo}</td>
                            <td class="nm">${nameHTML}</td>
                            <td class="num">${row.runRate.toLocaleString()}</td>
                            <td class="num">${year.toLocaleString()}</td>
                            <td class="num" style="font-weight:700;color:var(--accent);">${total.toLocaleString()}</td>`;
                        tbody.appendChild(tr);
                        return;
                    }

                    let status = 'OK';
                    if (row.runRate > 0 && (row.inv / row.runRate) < 2) status = 'Risk';
                    if (status === 'Risk') tr.className = 'risk';

                    const cells = `
                        <td class="no num col-no">${row.itemNo === 9999 ? '-' : row.itemNo}</td>
                        <td class="nm">${nameHTML}</td>
                        <td class="out num">${row.rawOutflow.toLocaleString()}</td>
                        <td class="num">${row.runRate.toLocaleString()}</td>
                        <td class="num">${Math.round(row.inv).toLocaleString()}</td>
                        <td><span class="pill ${status === 'Risk' ? 'risk' : 'ok'}">${status === 'Risk' ? '要補' : 'OK'}</span></td>`;

                    if (this.view === 'sku') {
                        tr.onclick = (e) => { if (!e.target.closest('button')) app.showDetails(row); };
                        tr.style.cursor = 'pointer';
                        tr.innerHTML = cells + `
                        <td class="col-del"><button class="del" onclick="app.hideItem('${String(row.sku).replace(/'/g, "\\'")}')" title="隱藏">✕</button></td>`;
                    } else {
                        tr.innerHTML = cells;
                    }
                    tbody.appendChild(tr);
                });
                
                empty.style.display = visibleCount === 0 ? "block" : "none";
                document.getElementById('mult-total').innerText = yearSum.toLocaleString();
                this.updateSortIcons();
            },

            sort(key, forceAsc) {
                if(forceAsc) { this.sortAsc = true; this.sortCol = key; }
                else { this.sortAsc = (this.sortCol === key) ? !this.sortAsc : true; this.sortCol = key; }
                const m = this.sortAsc ? 1 : -1;
                const set = this.view === 'sku' ? this.data : this.productData;  // 年量與產品同一份
                set.sort((a, b) => {
                    let v1 = a[key], v2 = b[key];
                    if (typeof v1 === 'string') return v1.localeCompare(v2) * m;
                    return (v1 - v2) * m;
                });
                this.render(document.getElementById('search').value);
            },

            updateSortIcons() {
                document.querySelectorAll('thead th[onclick]').forEach(th => {
                    th.classList.remove('asc', 'desc');
                    if(th.getAttribute('onclick').includes(this.sortCol)) th.classList.add(this.sortAsc ? 'asc' : 'desc');
                });
            },

            hideItem(sku) { if(confirm('Hide?')) { this.hiddenSKUs.add(sku); safeStorage.set('pm_hidden_skus', Array.from(this.hiddenSKUs)); document.getElementById('hidden-count').innerText = this.hiddenSKUs.size; this.render(document.getElementById('search').value); } },
            clearHidden() { if(confirm('Reset?')) { this.hiddenSKUs.clear(); safeStorage.set('pm_hidden_skus', []); document.getElementById('hidden-count').innerText = 0; this.render(document.getElementById('search').value); } },
            
            exportCSV() {
                const dataset = this.view === 'sku' ? this.data : this.productData;
                if(!dataset.length) { alert("No data"); return; }
                let headers, mapper;
                if (this.view === 'year') {
                    headers = ["項次","產品","月需","年需求",`倍數 ${this.mult} 後總量`];
                    mapper = r => [r.itemNo, r.name, r.runRate, r.runRate * 12, Math.round(r.runRate * 12 * this.mult)];
                } else if (this.view === 'sku') {
                    headers = ["項次","品項","總出","月需","北倉","風險"];
                    mapper = r => [r.itemNo, r.sku, r.rawOutflow, r.runRate, r.inv, r.status];
                } else {
                    headers = ["項次","產品","總出","月需","北倉","風險"];
                    mapper = r => [r.itemNo, r.name, r.rawOutflow, r.runRate, r.inv, r.status];
                }
                const csv = "\ufeff" + [headers.join(","), ...dataset.filter(r => this.view!=='sku' || !this.hiddenSKUs.has(r.sku)).map(r => mapper(r).map(c => `"${String(c).replace(/"/g, '""')}"`).join(","))].join("\n");
                const url = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
                const a = document.createElement("a"); a.href = url; a.download = `Inv_${this.view}_${new Date().toISOString().split('T')[0]}.csv`; a.click();
            },

            showDetails(row) {
                document.getElementById('modal-content').innerHTML = `
                    <div style="font-weight:600;font-size:14px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);">${row.sku}</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
                        <div style="background:#f8fafc;padding:10px;border-radius:8px;">
                            <div style="font-size:11px;color:var(--ink-3);">總出（已排除盤點退庫）</div>
                            <div style="font-weight:700;font-size:18px;color:var(--accent);" class="num">${row.rawOutflow.toLocaleString()}</div>
                        </div>
                        <div style="background:#f8fafc;padding:10px;border-radius:8px;">
                            <div style="font-size:11px;color:var(--ink-3);">計算月數</div>
                            <div style="font-weight:700;font-size:18px;" class="num">${row.months}</div>
                        </div>
                    </div>
                    <div style="font-size:12.5px;color:var(--ink-2);">
                        月需 ＝ ${row.rawOutflow.toLocaleString()} ÷ ${row.months} ＝ <strong>${row.runRate.toLocaleString()}</strong><br>
                        北倉 ${Math.round(row.inv).toLocaleString()} 件，可撐 ${row.runRate > 0 ? (row.inv / row.runRate).toFixed(1) : '∞'} 個月
                    </div>
                `;
                document.getElementById('modal-debug').classList.add('active');
            },
                        closeModal() { document.getElementById('modal-debug').classList.remove('active'); },
            // RESTORED: Toggle Loader Helper
            toggleLoader(show) { document.getElementById('loader').classList.toggle('hidden', !show); },
            toggleSettings(show) { 
                const m = document.getElementById('modal-settings'); show ? m.classList.add('active') : m.classList.remove('active');
                if(show) { document.getElementById('conf-id').value = CONFIG.ID; document.getElementById('conf-tab').value = CONFIG.TAB; }
            },
            saveSettings() { 
                CONFIG.ID = document.getElementById('conf-id').value;
                CONFIG.TAB = document.getElementById('conf-tab').value;
                safeStorage.set('pm_inv_config_v42', CONFIG);
                this.toggleSettings(false);
                this.fetchData();
            },
            loadMockData() { /* ... */ }
        };

        window.addEventListener('load', () => app.init());
    </script>
</body>
</html>
