<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備料水位表</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
    body { font-family: "Microsoft JhengHei", -apple-system, sans-serif; background:#f8fafc; color:#0f172a; }
    .card { background:#fff; border:1px solid #e2e8f0; }
    .btn { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
           border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; border:1px solid #e2e8f0;
           background:#fff; color:#0f172a; padding:6px 12px; transition:background .15s; }
    .btn:hover { background:#f1f5f9; }
    .btn.on { background:#4f46e5; color:#fff; border-color:#4f46e5; }
    .inp { height:38px; border:1px solid #e2e8f0; border-radius:6px; padding:0 10px; font-size:13px; background:#fff; }

    /* 四個備料分類，跟庫存儀表板同一套語言 */
    .t-short { background:hsl(0 84% 94%); color:hsl(0 72% 35%); }
    .t-ok    { background:hsl(145 60% 93%); color:hsl(150 55% 25%); }
    .t-many  { background:hsl(45 95% 90%); color:hsl(38 85% 28%); }
    .t-over  { background:hsl(28 96% 92%); color:hsl(25 90% 33%); }
    .tier-card { cursor:pointer; transition:box-shadow .15s, transform .15s; }
    .tier-card:hover { box-shadow:0 4px 10px -2px rgb(0 0 0 / .12); transform:translateY(-1px); }
    .tier-card[data-on="true"] { outline:2px solid #4f46e5; outline-offset:1px; }

    th { background:#f8fafc; font-size:12px; font-weight:600; color:#64748b; padding:10px 8px; text-align:right; white-space:nowrap; }
    th:first-child { text-align:left; }
    th.s { cursor:pointer; }
    th.s:hover { color:#4f46e5; }
    td { padding:9px 8px; font-size:13px; text-align:right; }
    td:first-child { text-align:left; }
    tbody tr { border-top:1px solid #f1f5f9; }
    tbody tr.main:hover { background:#f8fafc; }
    .detail td { background:#f8fafc; }
    .spin { animation:spin 1s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="min-h-screen p-3 sm:p-4">
<div class="max-w-6xl mx-auto space-y-3 sm:space-y-4">

    <div class="flex items-center justify-between gap-2">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold">備料水位表</h1>
            <div class="text-xs text-slate-400" id="sub">讀取中</div>
        </div>
        <div class="flex gap-2 shrink-0">
            <button class="btn" onclick="app.load()">重新整理</button>
            <button class="btn" onclick="app.toggleSet()">設定</button>
        </div>
    </div>

    <!-- 設定 -->
    <div id="settings" class="card rounded-lg p-3 hidden">
        <div class="flex flex-wrap items-end gap-3 text-sm">
            <label class="flex flex-col gap-1">
                <span class="text-xs text-slate-500">補貨前置期（月）</span>
                <input id="s-lead" type="number" class="inp w-24" value="3">
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs text-slate-500">安全庫存（月）</span>
                <input id="s-safe" type="number" class="inp w-24" value="1">
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs text-slate-500">到貨時剩餘效期（月）</span>
                <input id="s-shelf" type="number" class="inp w-28" value="34">
            </label>
            <button class="btn on" onclick="app.saveSet()">套用</button>
            <span class="text-xs text-slate-400">要補的門檻＝前置期＋安全庫存。效期用來判斷備太多。</span>
        </div>
    </div>

    <!-- 工具列 -->
    <div class="card rounded-lg p-3">
        <div class="flex flex-col sm:flex-row gap-2">
            <input id="q" class="inp flex-1" placeholder="搜尋產品" oninput="app.render()">
            <div class="flex gap-2">
                <button class="btn on flex-1" id="f-real" onclick="app.setKind('real')">正品</button>
                <button class="btn flex-1" id="f-pack" onclick="app.setKind('pack')">包材周邊</button>
                <button class="btn flex-1" id="f-all" onclick="app.setKind('all')">全部</button>
                <button class="btn shrink-0" onclick="app.exportCSV()">匯出</button>
            </div>
        </div>
        <div class="text-xs text-slate-400 mt-2" id="basis"></div>
    </div>

    <!-- 四個備料分類 -->
    <div class="grid grid-cols-4 gap-2 sm:gap-3" id="tiers"></div>

    <!-- 表格（桌機） -->
    <div class="card rounded-lg hidden md:block overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr>
                    <th class="s" onclick="app.sort('name')">產品</th>
                    <th class="s" onclick="app.sort('stock')">可用庫存</th>
                    <th class="s" onclick="app.sort('rate6')">月均</th>
                    <th class="s" onclick="app.sort('year')">一年份</th>
                    <th class="s" onclick="app.sort('runway')">可撐月數</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <!-- 清單（手機） -->
    <div class="card rounded-lg md:hidden" id="mlist"></div>

    <div class="text-xs text-slate-400 text-right" id="stamp">最後更新 2026/07/27 22:55</div>
</div>
</div>

<script>
const SHEETS = {
    TPE:  '14yjT90s9CV988KZZ_o6m8F4LbeDWpKTuqVO66gfLboI',
    SC:   '12C25rcfSEMtSkkARzLtxlW9Wmhu64m6eSP_KoK8M-js',
    MOMO: '1j04xLITImSX6WgtXkaGQfs0IZ5E8r3UEOrT2CKKGAxE'
};
// 這些類別是庫存校正，不是需求，不列入月均
const NON_DEMAND = ['盤點', '退庫', '歸倉', '客退'];
const SET_KEY = 'pm_outflow_settings_v1';

const csv = (text) => {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i + 1];
        if (c === '"') { if (q && n === '"') { f += '"'; i++; continue; } q = !q; }
        else if (c === ',' && !q) { row.push(f); f = ''; }
        else if ((c === '\n' || c === '\r') && !q) { if (c === '\r' && n === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
        else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows;
};
const num = (v) => { const x = parseFloat(String(v == null ? '' : v).replace(/[,\s]/g, '')); return isNaN(x) ? 0 : x; };
// 品名去掉尾端的效期與破折號，讓三張表與出貨日誌對得起來
const baseName = (s) => String(s || '').replace(/\s*\(?\d{4}-\d{2}-\d{2}\)?.*$/, '').replace(/\s*-\s*$/, '').trim();
const ymOf = (id) => { const m = String(id).match(/^(\d{2})\.(\d{2})/); return m ? '20' + m[1] + '-' + m[2] : null; };
const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const r1 = (n) => (Math.round(n * 10) / 10).toLocaleString();

const app = {
    products: [], kind: 'real', sortKey: 'runway', asc: true, tier: null, open: {},
    lead: 3, safe: 1, shelf: 34, basis: '',

    async init() {
        try {
            const s = JSON.parse(localStorage.getItem(SET_KEY) || 'null');
            if (s) { this.lead = s.lead; this.safe = s.safe; this.shelf = s.shelf; }
        } catch (e) { /* 用預設 */ }
        document.getElementById('s-lead').value = this.lead;
        document.getElementById('s-safe').value = this.safe;
        document.getElementById('s-shelf').value = this.shelf;
        await this.load();
    },

    toggleSet() { document.getElementById('settings').classList.toggle('hidden'); },
    saveSet() {
        this.lead = num(document.getElementById('s-lead').value) || 3;
        this.safe = num(document.getElementById('s-safe').value) || 0;
        this.shelf = num(document.getElementById('s-shelf').value) || 34;
        try { localStorage.setItem(SET_KEY, JSON.stringify({ lead: this.lead, safe: this.safe, shelf: this.shelf })); } catch (e) {}
        this.toggleSet(); this.render();
    },

    url(id, tab, range) {
        const r = range ? `&range=${range}` : '';
        return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?sheet=${encodeURIComponent(tab)}${r}&tqx=out:csv`;
    },

    async grab(u) {
        const res = await fetch(u, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return csv(await res.text());
    },

    async load() {
        document.getElementById('sub').innerHTML = '<span class="spin">◐</span> 讀取中';
        try {
            const [tpe, sc, momo, log] = await Promise.all([
                this.grab(this.url(SHEETS.TPE, 'inventory_tracking', 'A4:Z')),
                this.grab(this.url(SHEETS.SC, 'inventory_tracking', 'A4:Z')),
                this.grab(this.url(SHEETS.MOMO, 'inventory_tracking', 'A4:Z')),
                this.grab(this.url(SHEETS.TPE, 'LOG_inventory_update'))
            ]);
            this.build(tpe, sc, momo, log);
            this.render();
        } catch (e) {
            document.getElementById('sub').innerText = '讀取失敗：' + e.message;
        }
    },

    build(tpe, sc, momo, log) {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const map = new Map();
        const get = (name) => {
            const k = baseName(name);
            if (!map.has(k)) map.set(k, { name: k, type: '', tpe: 0, sc: 0, momo: 0, expired: 0, batches: [] });
            return map.get(k);
        };

        // 三倉庫存：D 品名、E 效期、J 數量；台北的 B 欄有 product_type
        const readStock = (rows, key, typeCol) => {
            rows.forEach(r => {
                const name = (r[3] || '').trim();
                if (!name || name.includes('unique_key') || name.includes('sort_')) return;
                const exp = (r[4] || '').trim();
                const hasExp = /^\d{4}-\d{2}-\d{2}$/.test(exp);
                const qty = num(r[9]);
                const p = get(name);
                if (typeCol && r[typeCol] && !p.type) p.type = String(r[typeCol]).trim();
                // 包材與印刷品沒有效期，照樣算可用庫存
                if (hasExp && new Date(exp + 'T00:00:00') < today) {
                    p.expired += qty;   // 已過期的貨不能算進可撐月數，另外標出來
                    return;
                }
                p[key] += qty;
                if (qty > 0 && hasExp) p.batches.push({ exp, qty, where: key });
            });
        };
        readStock(tpe, 'tpe', 1);
        readStock(sc, 'sc', 1);
        readStock(momo, 'momo', null);

        // 出貨日誌：A 事件時戳、C 產品、D 數量、F 類別
        const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const winMonths = (n) => {
            const out = [];
            for (let i = n; i >= 1; i--) {
                const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                out.push(monthKey(d));
            }
            return out;
        };
        const w6 = winMonths(6), w3 = winMonths(3);
        const d6 = {}, d3 = {};
        let skippedNonDemand = 0;
        log.forEach(r => {
            const ym = ymOf(r[0]);
            if (!ym) return;
            const qty = num(r[3]);
            if (qty >= 0) return;
            if (NON_DEMAND.includes(String(r[5]).trim())) { skippedNonDemand += -qty; return; }
            const k = baseName(r[2]);
            if (w6.includes(ym)) d6[k] = (d6[k] || 0) + (-qty);
            if (w3.includes(ym)) d3[k] = (d3[k] || 0) + (-qty);
        });

        this.products = Array.from(map.values()).map(p => {
            const rate6 = (d6[p.name] || 0) / 6;
            const rate3 = (d3[p.name] || 0) / 3;
            const stock = p.tpe + p.sc + p.momo;
            const runway = rate6 > 0 ? stock / rate6 : Infinity;
            p.batches.sort((a, b) => a.exp < b.exp ? -1 : 1);
            return { ...p, rate6, rate3, stock, runway, year: rate6 * 12 };
        });

        const expiredQty = this.products.reduce((s, p) => s + p.expired, 0);
        const expiredN = this.products.filter(p => p.expired > 0).length;
        this.basis = `月均取近 6 個完整月（${w6[0]} 到 ${w6[5]}），已排除 ${NON_DEMAND.join('、')} 共 ${Math.round(skippedNonDemand).toLocaleString()} 件的庫存校正。庫存為北倉＋三重＋MOMO，已過期的不計入可撐月數。`
            + (expiredQty ? `目前有 ${expiredN} 個產品共 ${Math.round(expiredQty).toLocaleString()} 件已經過期。` : '');
        document.getElementById('basis').innerText = this.basis;
        document.getElementById('sub').innerText = `資料讀取 ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`;
    },

    tiersOf() {
        const need = this.lead + this.safe;
        return [
            { key: 'short', label: '要補', short: '要補', cls: 't-short', test: (p) => p.runway < need },
            { key: 'ok', label: '正常', short: '正常', cls: 't-ok', test: (p) => p.runway >= need && p.runway <= 12 },
            { key: 'many', label: '偏多', short: '偏多', cls: 't-many', test: (p) => p.runway > 12 && p.runway <= this.shelf },
            // 可撐超過保存期，或根本沒出貨，都是這批注定用不完
            { key: 'over', label: '過量', short: '過量', cls: 't-over', test: (p) => p.runway > this.shelf }
        ];
    },
    tierOf(p) { return this.tiersOf().find(t => t.test(p)); },

    scoped() {
        const term = document.getElementById('q').value.trim().toLowerCase();
        return this.products.filter(p => {
            if (this.kind === 'real' && !String(p.type).startsWith('正品')) return false;
            if (this.kind === 'pack' && String(p.type).startsWith('正品')) return false;
            if (term && !p.name.toLowerCase().includes(term)) return false;
            return true;
        });
    },

    rows() {
        let list = this.scoped();
        if (this.tier) { const t = this.tiersOf().find(x => x.key === this.tier); list = list.filter(t.test); }
        const k = this.sortKey, m = this.asc ? 1 : -1;
        return list.slice().sort((a, b) => {
            let x = a[k], y = b[k];
            if (typeof x === 'string') return x.localeCompare(y) * m;
            if (x === Infinity) x = Number.MAX_VALUE;
            if (y === Infinity) y = Number.MAX_VALUE;
            return (x - y) * m;
        });
    },

    setKind(k) {
        this.kind = k;
        ['real', 'pack', 'all'].forEach(x => document.getElementById('f-' + x).className = 'btn flex-1' + (x === k ? ' on' : ''));
        this.render();
    },
    sort(k) { if (this.sortKey === k) this.asc = !this.asc; else { this.sortKey = k; this.asc = true; } this.render(); },
    setTier(k) { this.tier = this.tier === k ? null : k; this.render(); },
    toggle(name) { this.open[name] = !this.open[name]; this.render(); },

    // 半年 / 一年 / 兩年份各是多少件，下了之後可撐多久，會不會超過效期
    options(p) {
        if (!(p.rate6 > 0)) return [];
        return [[0.5, '半年份'], [1, '一年份'], [2, '兩年份']].map(([y, label]) => {
            const qty = Math.round(p.rate6 * 12 * y);
            const after = (p.stock + qty) / p.rate6;
            return { label, qty, after, over: after > this.shelf };
        });
    },

    render() {
        const list = this.scoped();
        const tiers = this.tiersOf();
        document.getElementById('tiers').innerHTML = tiers.map(t => {
            const n = list.filter(t.test).length;
            return `<div class="card tier-card rounded-lg p-2 sm:p-3 ${t.cls}" data-on="${this.tier === t.key}" onclick="app.setTier('${t.key}')">
                <div class="text-xs sm:text-sm font-medium whitespace-nowrap"><span class="sm:hidden">${t.short}</span><span class="hidden sm:inline">${t.label}</span></div>
                <div class="text-lg sm:text-2xl font-bold leading-tight">${n}</div>
                <div class="text-xs opacity-80">個產品</div>
            </div>`;
        }).join('');

        const rows = this.rows();
        const arrow = (k) => this.sortKey === k ? (this.asc ? ' ↑' : ' ↓') : '';
        document.querySelectorAll('th.s').forEach(th => {
            const k = th.getAttribute('onclick').match(/'(\w+)'/)[1];
            th.innerText = th.innerText.replace(/[ ↑↓]+$/, '') + arrow(k);
        });

        const runTxt = (p) => p.runway === Infinity ? '無出貨' : r1(p.runway) + ' 月';
        const tbody = document.getElementById('tbody');
        const mlist = document.getElementById('mlist');

        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-slate-400 py-8">沒有符合的產品</td></tr>';
            mlist.innerHTML = '<div class="text-center text-slate-400 py-8 text-sm">沒有符合的產品</div>';
            return;
        }

        tbody.innerHTML = rows.map(p => {
            const t = this.tierOf(p);
            const detail = this.open[p.name] ? `<tr class="detail"><td colspan="6">${this.detailHTML(p)}</td></tr>` : '';
            return `<tr class="main cursor-pointer" onclick="app.toggle('${p.name.replace(/'/g, "\\'")}')">
                <td class="font-medium">${p.name}${p.expired ? ` <span class="text-xs text-rose-500 whitespace-nowrap">已過期 ${p.expired.toLocaleString()}</span>` : ''}</td>
                <td>${p.stock.toLocaleString()}</td>
                <td>${r1(p.rate6)}</td>
                <td>${p.rate6 > 0 ? Math.round(p.year).toLocaleString() : '-'}</td>
                <td class="font-bold">${runTxt(p)}</td>
                <td><span class="${t.cls} px-2 py-1 rounded text-xs font-medium">${t.label}</span></td>
            </tr>${detail}`;
        }).join('');

        mlist.innerHTML = rows.map(p => {
            const t = this.tierOf(p);
            return `<div class="border-b last:border-b-0 border-slate-100">
                <div class="px-3 py-2" onclick="app.toggle('${p.name.replace(/'/g, "\\'")}')">
                    <div class="flex items-start justify-between gap-2">
                        <div class="font-medium text-sm leading-snug">${p.name}</div>
                        <span class="${t.cls} shrink-0 px-2 py-0.5 rounded text-xs font-medium">${runTxt(p)}</span>
                    </div>
                    <div class="flex justify-between gap-2 mt-1 text-xs text-slate-500">
                        <span>庫存 ${p.stock.toLocaleString()}　月均 ${r1(p.rate6)}</span>
                        <span>一年份 ${p.rate6 > 0 ? Math.round(p.year).toLocaleString() : '-'}</span>
                    </div>
                </div>
                ${this.open[p.name] ? `<div class="px-3 pb-3">${this.detailHTML(p)}</div>` : ''}
            </div>`;
        }).join('');
    },

    detailHTML(p) {
        const trend = p.rate3 > p.rate6 * 1.2 ? '近三個月在升' : p.rate3 < p.rate6 * 0.8 ? '近三個月在降' : '近三個月持平';
        const opts = this.options(p);
        const optHTML = opts.length ? `
            <div class="mt-2">
                <div class="text-xs text-slate-500 mb-1">這次下單的話</div>
                <div class="flex flex-wrap gap-2">
                    ${opts.map(o => `<div class="rounded px-2 py-1 text-xs ${o.over ? 't-over' : 't-ok'}">
                        ${o.label} ${o.qty.toLocaleString()} 件　下了可撐 ${r1(o.after)} 月${o.over ? '　超過效期' : ''}
                    </div>`).join('')}
                </div>
            </div>` : '<div class="text-xs text-slate-400 mt-2">近六個月沒有出貨紀錄，沒辦法估月均</div>';
        const batch = p.batches.length
            ? `最早效期 ${p.batches[0].exp}（${p.batches[0].qty.toLocaleString()} 件）`
            : (p.expired ? `庫存全部已過期（${p.expired.toLocaleString()} 件）` : '沒有效期資料');
        return `<div class="text-xs text-slate-600 space-y-1 py-1">
            <div>北倉 ${p.tpe.toLocaleString()}　三重 ${p.sc.toLocaleString()}　MOMO ${p.momo.toLocaleString()}${p.expired ? `　已過期 ${p.expired.toLocaleString()}` : ''}</div>
            <div>月均 近六月 ${r1(p.rate6)}　近三月 ${r1(p.rate3)}　${trend}</div>
            <div>${batch}</div>
            ${optHTML}
        </div>`;
    },

    exportCSV() {
        const rows = this.rows();
        if (!rows.length) { alert('沒有資料'); return; }
        const head = ['產品', '北倉', '三重', 'MOMO', '可用庫存', '已過期', '月均(近6月)', '月均(近3月)', '一年份', '可撐月數', '狀態'];
        const body = rows.map(p => [p.name, p.tpe, p.sc, p.momo, p.stock, p.expired,
            Math.round(p.rate6 * 10) / 10, Math.round(p.rate3 * 10) / 10,
            p.rate6 > 0 ? Math.round(p.year) : '', p.runway === Infinity ? '' : Math.round(p.runway * 10) / 10,
            this.tierOf(p).label]);
        const text = '﻿' + [head, ...body].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8;' }));
        a.download = `備料水位_${fmtDate(new Date())}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    }
};
window.addEventListener('load', () => app.init());
